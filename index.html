      /* ---------- Echte Bildschirmaufnahme (für Hosts) ---------- */
      const SVGNS='http://www.w3.org/2000/svg',SVG_PROPS=['fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','stroke-dasharray','stroke-dashoffset','opacity','fill-opacity','stroke-opacity','fill-rule','color','display','transform','transform-origin','visibility'];
      const _defCache={};let _sandbox=null;
      function defStyle(tag){
        if(_defCache[tag])return _defCache[tag];
        if(!_sandbox){_sandbox=document.createElement('div');_sandbox.style.cssText='all:initial;position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden;visibility:hidden';document.body.append(_sandbox)}

      function cloneShot(src,root){
        if(src.nodeType===3)return src.cloneNode();
        if(src.nodeType!==1)return null;
        const tag=src.tagName.toLowerCase();

        let c;

        else if(tag==='iframe'||tag==='video'||tag==='object'||tag==='embed'){c=document.createElement('div');c.style.background=cs.backgroundColor==='rgba(0, 0, 0, 0)'?'#fff':cs.backgroundColor}

        else{

        if(tag!=='canvas'&&tag!=='iframe'&&tag!=='video'&&tag!=='textarea'){
          for(let n=src.firstChild;n;n=n.nextSibling){const k=cloneShot(n,false);if(k)c.append(k)}

      }
      async function snapScreen(maxW=560){
        const W=os.clientWidth,H=os.clientHeight;if(!W||!H)return null;
        const kids=[];for(let n=os.firstChild;n;n=n.nextSibling){const k=cloneShot(n,false);if(k)kids.push(k)}
        const root=document.createElement('div');root.style.cssText=`position:relative;overflow:hidden;width:${W}px;height:${H}px;background:#000;font-family:${getComputedStyle(os).fontFamily}`;
        kids.forEach(k=>root.append(k));
        const html=new XMLSerializer().serializeToString(root);
        const T=Math.min(maxW,W),Th=Math.round(H*T/W);
        const svg=`<svg xmlns="${SVGNS}" width="${T}" height="${Th}" viewBox="0 0 ${W} ${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${html}</foreignObject></svg>`;
        const img=new Image();img.decoding='async';
        await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
        const cv=document.createElement('canvas');cv.width=T;cv.height=Th;const x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,T,Th);x.drawImage(img,0,0,T,Th);
        let q=.58,url=cv.toDataURL('image/jpeg',q);while(url.length>180000&&q>.25){q-=.12;url=cv.toDataURL('image/jpeg',q)}
        return {img:url,w:T,h:Th};
      }

      const barsHtml=(p,mine)=>{const c=pollCounts(p),tot=c.reduce((a,b)=>a+b,0);return (p.opts||[]).map((o,i)=>`<div class="hp-bar2"><div class="tr"><i style="width:${tot?Math.round(c[i]/tot*100):0}%"></i><span>${esc(o)}${mine===i?' ✓':''}</span></div><em>${c[i]}</em></div>`).join('')};

      /* ---------- Olli Room: Einstellungen (Beitreten, Hosten, Host-Verwaltung) ---------- */
      const RS={join:{code:'',pw:'',name:'',vis:'pub',hpw:''}};
      function roomMount(root,mode,go){

        ROOM.ui.add(draw);

            const p=$('#rj-panel',root);if(p)p.onclick=()=>openApp('rpanel');

            $$('[data-pv]',root).forEach(x=>x.onclick=async()=>{const[id,i]=x.dataset.pv.split(':');const pp=ROOM.polls[id];if(pp){await votePoll(pp,+i)}});

          const bind=(id,k)=>{const i=$(id,root);i.oninput=()=>{J[k]=i.value};i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){(k==='code'||k==='pw'?$('#rj-go',root):$('#rh-go',root)).click()}}};

          $('#rh-go',root).onclick=async()=>{const b=$('#rh-go',root),e=$('#rh-err',root);b.disabled=true;e.textContent='';const r=await roomCreate(J.name,J.vis==='pub',J.hpw).catch(()=>'Der Server konnte nicht erstellt werden.');b.disabled=false;if(r)e.textContent=r;else{J.name=J.hpw=''}};
          if(ROOM.listUn){try{ROOM.listUn()}catch(e){}}

            const L=$('#rm-list',root);if(!L||!root.isConnected){try{ROOM.listUn()}catch(e){}ROOM.listUn=null;return}

            L.innerHTML=rows.length?rows.map(r=>`<div class="rm-srv">${I.oroom.replace('<svg','<svg style="width:34px;height:34px;flex:0 0 auto"')}<div class="tx"><b>${esc(r.name)}</b><small>Host: ${esc(r.hostName||r.host)} · ${r.pub?'Öffentlich':'Privat, mit Kennwort'}</small></div><button class="btn" data-join="${esc(r.id)}" data-pub="${r.pub?1:0}">Beitreten</button></div>`).join(''):'<p style="color:var(--text2)">Noch keine Server. Erstelle den ersten.</p>';
            $$('[data-join]',L).forEach(x=>x.onclick=async()=>{
              const id=x.dataset.join;if(x.dataset.pub==='1'){x.disabled=true;const r=await roomJoin(id,'').catch(()=>'Beitritt fehlgeschlagen.');x.disabled=false;if(r)$('#rj-err',root).textContent=r;return}
              const m=zModal(`<h3 style="margin:0 0 6px">Privater Server</h3><p style="margin:0 0 10px;color:var(--text2)">Gib das Kennwort ein, das der Host festgelegt hat.</p><input class="inp" id="jp" type="password" style="width:100%"><div class="ob-err" id="jpe"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn pri" id="jpo">Beitreten</button><button class="btn" id="jpx">Abbrechen</button></div>`);
              const go2=async()=>{const r=await roomJoin(id,$('#jp',m).value).catch(()=>'Beitritt fehlgeschlagen.');if(r)$('#jpe',m).textContent=r;else m.remove()};
              $('#jpo',m).onclick=go2;$('#jpx',m).onclick=()=>m.remove();$('#jp',m).addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')go2()});setTimeout(()=>$('#jp',m).focus(),40)});
          },()=>{const L=$('#rm-list',root);if(L)L.innerHTML='<p style="color:var(--text2)">Die Serverliste konnte nicht geladen werden.</p>'});
        }
        function drawHostsOnly(){
          const box=$('#rh-hosts',root);if(!box||!root.isConnected||!ROOM.room){MEMCB.delete(drawHostsOnly);return}
          const R=ROOM.room,mainH=R.host===meLow(),hs=R.hosts||[],all=Object.values(ROOM.members);
          box.innerHTML=`<div style="display:grid;gap:8px">${hs.map(l=>`<div class="rm-srv"><div class="tx"><b>${esc((R.hostNames||{})[l]||l)}</b><small>${l===R.host?'Ersteller des Servers':'Host'}</small></div>${mainH&&l!==R.host?`<button class="btn" data-drop="${esc(l)}">Host-Rechte entziehen</button>`:''}</div>`).join('')}</div><h3 style="margin:16px 0 6px;font-size:15px">Teilnehmer zum Host machen</h3><p style="color:var(--text2);margin:0 0 8px">Neue Hosts bekommen eine Benachrichtigung. Danach erscheinen Host-Panel und Verwaltung auch in ihren Einstellungen.</p><div style="display:grid;gap:8px">${all.filter(m=>!hs.includes(m.id)).map(m=>`<div class="rm-srv"><div class="tx"><b>${esc(m.name)}</b><small>Teilnehmer</small></div><button class="btn pri" data-mk="${esc(m.id)}">Zum Host machen</button></div>`).join('')||'<p style="color:var(--text2)">Keine weiteren Teilnehmer.</p>'}</div>`;
          $$('[data-mk]',box).forEach(x=>x.onclick=async()=>{x.disabled=true;const nm=(ROOM.members[x.dataset.mk]||{}).name||x.dataset.mk;await makeHost(x.dataset.mk,nm).catch(()=>{});notify('room','Neuer Host',`${nm} ist jetzt Host.`)});
          $$('[data-drop]',box).forEach(x=>x.onclick=()=>dropHost(x.dataset.drop));

        function drawHost(){
          const R=ROOM.room,mainH=R.host===meLow();
          root.innerHTML=`<div class="rm-card"><div class="rm-head"><h2>${esc(R.name)}</h2><span class="rm-code" title="Servercode">${esc(ROOM.cur)}</span></div><p>Das Host-Panel zeigt alle Teilnehmer wie in einem Klassenzimmer. Solange es offen ist, sehen die Teilnehmer „Host aktiv“.</p><div class="row"><button class="btn pri" id="rh-open">Host-Panel öffnen</button></div></div><h3 style="margin:6px 0 0;font-weight:600">Hosts</h3><div id="rh-hosts"></div><div class="rm-card" style="max-width:520px"><h3>Servereinstellungen</h3><label>Servername<input class="inp" id="sv-n" maxlength="30" value="${esc(R.name)}"></label><label class="chk"><input type="radio" name="sv-v" value="pub" ${R.pub?'checked':''}> Öffentlich</label><label class="chk"><input type="radio" name="sv-v" value="priv" ${R.pub?'':'checked'}> Privat (mit Kennwort)</label><label id="sv-pl" ${R.pub?'hidden':''}>Neues Kennwort (leer lassen, um es zu behalten)<input class="inp" id="sv-p" type="password" autocomplete="off"></label><div class="rm-err" id="sv-e"></div><div class="row"><button class="btn pri" id="sv-s">Speichern</button>${mainH?'<button class="btn" id="sv-d">Server löschen</button>':''}</div></div>`;

      }

      /* ---------- Host-Panel (Classroom-Stil) ---------- */

        const root=$('#hp',b),side=$('#hp-side',b),body=$('#hp-body',b),selbar=$('#hp-selbar',b),dr=$('#hp-dr',b);
        const members=()=>Object.values(ROOM.members).filter(m=>m.id!==me);
        const isOn=m=>Date.now()-m.t<75000,lockedOf=m=>{const c=ROOM.ctls[m.id];return !!(c&&c.lock&&c.lock.on)};
        const isH=m=>(ROOM.room.hosts||[]).includes(m.id);
        const appId=m=>{const f=(m.wins||[]).find(x=>x.f)||(m.wins||[])[(m.wins||[]).length-1];return f?f.a:null};
        const match=m=>{const f=P.f;if(f==='all')return true;if(f==='offline')return !isOn(m);if(f==='hand')return isOn(m)&&m.hand;if(f==='locked')return lockedOf(m);if(f.startsWith('app:'))return isOn(m)&&m.app===f.slice(4);return true};
        const title=()=>({all:'Alle Teilnehmer',offline:'Offline',hand:'Hand gehoben',locked:'Gesperrt'})[P.f]||P.f.slice(4);
        function drawSide(){
          const ms=members(),on=ms.filter(isOn),apps={};on.forEach(m=>{const n=m.app||'Desktop';apps[n]=(apps[n]||0)+1});

          side.innerHTML=`<div class="hp-srv"><b title="${esc(ROOM.room.name)}">${esc(ROOM.room.name)}</b><span class="rm-code">${esc(ROOM.cur)}</span></div>${it('all',ICO.all,'Alle Teilnehmer',ms.length)}${it('offline',ICO.off,'Offline',ms.filter(m=>!isOn(m)).length)}${it('hand',ICO.hand,'Hand gehoben',on.filter(m=>m.hand).length)}${it('locked',ICO.lock,'Gesperrt',ms.filter(lockedOf).length)}<h4>Apps</h4>${Object.entries(apps).sort((a,c)=>c[1]-a[1]).map(([n,c])=>it('app:'+n,(appIconOf(n)||'').replace(/^<svg/,'<svg'),n,c)).join('')||'<div class="ch-hint">Noch keine aktiven Apps.</div>'}<h4>Klasse</h4>${it('',ICO.poll,'Umfragen',Object.keys(ROOM.polls).length,'polls')}${it('',ICO.cal,'Termine',(ROOM.revs||[]).length,'events')}`;

            const es=(ROOM.revs||[]).slice().sort((a,c)=>(a.date+(a.time||'')).localeCompare(c.date+(c.time||'')));
            body.innerHTML=`<h1 class="hp-h">Termine<small>${es.length}</small></h1><button class="hp-new" id="hp-ne">Neuer Termin für die Klasse</button><div class="hp-cards">${es.map(e=>`<div class="hp-card"><h3>${esc(e.title)}</h3><div style="font-size:13px;color:var(--text2)">${esc(fDate(e.date))}${e.time?' · '+esc(e.time)+' Uhr':''}${e.note?' · '+esc(e.note):''}</div><div><button class="btn" data-dele="${esc(e.id)}">Löschen</button></div></div>`).join('')||'<div class="hp-empty">Noch keine Termine. Sie landen automatisch im Kalender aller Teilnehmer.</div>'}</div>`;
            $('#hp-ne',body).onclick=eventDlgRoom;$$('[data-dele]',body).forEach(x=>x.onclick=()=>cdoc(roomPath('events/'+x.dataset.dele)).delete().catch(()=>{}));
          }else{
            const all=members(),L=all.filter(match).sort((a,c)=>(isOn(c)-isOn(a))||((c.hand||0)-(a.hand||0))||String(a.name).localeCompare(c.name));
            let h=`<h1 class="hp-h">${esc(title())}<small>${L.length}</small></h1>`;
            if(!all.length)h+=`<div class="hp-empty"><b style="color:var(--text);font-size:18px">Noch niemand da</b><br>Gib den Code <b class="rm-code">${esc(ROOM.cur)}</b> weiter. Sobald jemand beitritt, erscheint er hier mit seinem echten Bildschirm.</div>`;
            else if(!L.length)h+=`<div class="hp-empty">Hier ist gerade niemand.</div>`;
            else if(P.view==='circles')h+=`<div class="hp-grid">${L.map(circle).join('')}</div>`;
            else h+=`<div class="hp-scrgrid">${L.map(m=>`<button class="hp-sc${P.sel.has(m.id)?' sel':''}" data-id="${esc(m.id)}">${scrHtml(m,ROOM.ctls[m.id])}<b>${esc(m.name)}</b><small>${esc(isOn(m)?(m.app||'Desktop')+(m.title&&m.title!==m.app?' · '+m.title:''):'Offline')}</small></button>`).join('')}</div>`;
            body.innerHTML=h;P.fresh=false;
          }
          body.scrollTop=top;
        }
        function drawSel(){
          const n=P.sel.size;selbar.hidden=!(P.selMode&&n>0);if(selbar.hidden)return;
          selbar.innerHTML=`<span>${n} ausgewählt</span><button data-s="lock">Sperren</button><button data-s="unlock">Entsperren</button><button data-s="msg">Nachricht</button><button data-s="warn">Warnung</button><button data-s="all">Alle</button><button data-s="none" class="dg">Aufheben</button>`;
        }
        const targets=()=>[...P.sel].filter(id=>ROOM.members[id]&&!isH(ROOM.members[id]));
        selbar.onclick=async e=>{const a=e.target.closest('[data-s]');if(!a)return;const k=a.dataset.s,ids=targets();
          if(k==='lock')for(const i of ids)await lockOne(i,true);else if(k==='unlock')for(const i of ids)await lockOne(i,false);
          else if(k==='msg')textDlg('Nachricht an '+ids.length+' Auswahl','Nur die ausgewählten Personen sehen den Text.',t=>ids.forEach(i=>ctlSet(i,{msg:{text:t,by:mcSess().name,t:Date.now(),kind:'msg'}})));
          else if(k==='warn')textDlg('Warnung senden','Erscheint rot und mit Ton bei den ausgewählten Personen.',t=>ids.forEach(i=>ctlSet(i,{msg:{text:t,by:mcSess().name,t:Date.now(),kind:'warn'}})),'Warnen');
          else if(k==='all'){members().filter(match).forEach(m=>P.sel.add(m.id));refresh()}
          else if(k==='none'){P.sel.clear();refresh()}};
        body.onclick=e=>{const c=e.target.closest('[data-id]');if(!c)return;const id=c.dataset.id;
          if(P.selMode){P.sel.has(id)?P.sel.delete(id):P.sel.add(id);refresh()}else openDrawer(id)};
        $('#hp-sel',b).onclick=e=>{P.selMode=!P.selMode;if(!P.selMode)P.sel.clear();e.currentTarget.classList.toggle('on',P.selMode);e.currentTarget.textContent=P.selMode?'Fertig':'Auswählen';refresh()};
        $('#hp-tg',b).onclick=()=>root.classList.toggle('side-open');
        $$('[data-v]',b).forEach(x=>x.onclick=()=>setView(x.dataset.v));
        function setView(v){P.view=v;P.page='mem';P.fresh=true;$$('[data-v]',b).forEach(x=>x.classList.toggle('on',x.dataset.v===v));watchSync();refresh()}
        /* Gesten: Wischen wechselt die Ansicht, vom Rand öffnet die Seitenleiste */
        onSwipe(body,{left:()=>setView('screens'),right:()=>setView('circles')});
        onSwipe(side,{left:()=>root.classList.remove('side-open')});
        onSwipe(root,{right:()=>root.classList.add('side-open')},{edge:'left',zone:32});
        onSwipe(dr,{right:()=>closeDrawer()});
        /* Aktionen */
        const doAll=async(on,test)=>{for(const m of members().filter(x=>!isH(x)))await lockOne(m.id,on)};
        b.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,r=a.getBoundingClientRect();
          if(k==='msg')textDlg('Nachricht an alle','Der Text erscheint oben auf allen Bildschirmen.',t=>cdoc(roomPath('bc/last')).set({text:t,by:mcSess().name,t:Date.now(),kind:'msg'}).then(()=>notify('room','Nachricht gesendet','Alle Teilnehmer sehen sie oben im Bildschirm.')));
          else if(k==='poll')pollDlgRoom();else if(k==='event')eventDlgRoom();
          else if(k==='more')menu([
            {label:'Überwachen',disabled:true},{label:'Bildschirme überwachen',icon:ICO.mon,action:()=>setView('screens')},{label:'Als Kreise anzeigen',icon:ICO.circ,action:()=>setView('circles')},'-',
            {label:'Warnung',disabled:true},{label:'Warnung an alle senden',icon:I.hand,action:()=>textDlg('Warnung an alle','Erscheint rot und mit Ton bei allen Teilnehmern.',t=>cdoc(roomPath('bc/last')).set({text:t,by:mcSess().name,t:Date.now(),kind:'warn'}),'Warnen')},{label:'Alle sperren',icon:I.lockc,action:()=>doAll(true)},{label:'Alle entsperren',icon:I.lockc,action:()=>doAll(false)},{label:'Mich selbst sperren (Test)',icon:I.lockc,action:()=>lockOne(me,true,true)},'-'],r.left,r.bottom+4)});
        /* Detail-Schublade mit Live-Bildschirm */
        function openDrawer(id){P.open=id;dr.classList.add('open');drawDrawer();watchSync()}
        function closeDrawer(){P.open=null;dr.classList.remove('open');watchSync()}
        function drawDrawer(){
          if(!P.open)return;const m=ROOM.members[P.open];
          if(!m){dr.innerHTML=`<div class="hp-dh"><div><b>Nicht mehr im Server</b></div><button class="x" id="dr-x" aria-label="Schließen">✕</button></div>`;$('#dr-x',dr).onclick=closeDrawer;return}
          const c=ROOM.ctls[m.id],lk=!!(c&&c.lock&&c.lock.on),h=isH(m),hist=(m.hist||[]).slice().reverse();
          dr.innerHTML=`<div class="hp-dh"><div class="c" style="background:${colorOf(dispName(m.name))}">${esc(ini2(m.name))}</div><div><b>${esc(m.name)}</b><small>@${esc(m.id)} · ${h?'Host':'Teilnehmer'} · ${isOn(m)?'online':'offline'}</small></div><button class="x" id="dr-x" aria-label="Schließen">✕</button></div><div class="hp-dc">${scrHtml(m,c)}<ul class="rm-wl"><li>Aktuell: <b>${esc(isOn(m)?(m.app||'Desktop'):'Offline')}</b>${m.title&&m.title!==m.app?' · '+esc(m.title):''}</li>${hist.length>1?`<li>Zuletzt: ${hist.map(x=>`${esc(x.n)} (${fmtT(x.t)})`).join(' → ')}</li>`:''}<li>Geöffnete Fenster: ${(m.wins||[]).length}${m.hand?' · Hand gehoben':''}</li></ul><div class="hp-acts">${h?'':`<button class="btn pri" data-d="lock">${lk?'Entsperren':'Sperren'}</button><button class="btn" data-d="warn">Warnung</button><button class="btn" data-d="msg">Nachricht</button><button class="btn" data-d="host">Zum Host machen</button><button class="btn dg" data-d="kick">Entfernen</button>`}</div></div>`;
          $('#dr-x',dr).onclick=closeDrawer;
          $$('[data-d]',dr).forEach(x=>x.onclick=()=>{const k=x.dataset.d;
            if(k==='lock')lockOne(m.id,!lk);
            else if(k==='msg')textDlg('Nachricht an '+m.name,'Nur diese Person sieht den Text.',t=>ctlSet(m.id,{msg:{text:t,by:mcSess().name,t:Date.now(),kind:'msg'}}));
            else if(k==='warn')textDlg('Warnung an '+m.name,'Erscheint rot und mit Ton bei dieser Person.',t=>ctlSet(m.id,{msg:{text:t,by:mcSess().name,t:Date.now(),kind:'warn'}}),'Warnen');
            else if(k==='host')makeHost(m.id,m.name).then(()=>notify('room','Neuer Host',`${m.name} ist jetzt Host.`));
            else if(k==='kick')yesNo('Teilnehmer entfernen',`${m.name} aus dem Server entfernen?`,'Entfernen',()=>{kickOne(m.id);closeDrawer()})});
        }
        /* Überwachen: Wer gerade zugeschaut wird, bekommt das rote Auge */
        const iv=setInterval(()=>watchSync(true),15000);
        function watchSync(force){
          const want=new Set();
          if(P.open)want.add(P.open);
          if(P.view==='screens'&&P.page==='mem')members().filter(m=>isOn(m)&&!isH(m)).forEach(m=>want.add(m.id));
          want.forEach(id=>{if(force||!P.watching.has(id))ctlSet(id,{watch:{[me]:Date.now()}}).catch(()=>{})});
          P.watching.forEach(id=>{if(!want.has(id))ctlSet(id,{watch:{[me]:0}}).catch(()=>{})});
          P.watching=want;
        }
        function refresh(){drawSide();drawBody();drawSel();drawDrawer()}
        MEMCB.add(refresh);POLLCB.add(()=>{if(!w.d.isConnected)return;if(P.page!=='mem'||P.view==='screens')drawBody();drawSide()});
        refresh();
        w.onclose=()=>{clearInterval(hi);clearInterval(iv);MEMCB.delete(refresh);P.watching.forEach(id=>ctlSet(id,{watch:{[me]:0}}).catch(()=>{}));if(ROOM.cur)cdoc(roomPath('hostst/'+me)).delete().catch(()=>{});setTimeout(roomUI,350)};
      }

      /* ---------- Wisch-Gesten, Tutorial, Olli-Chat-Icon ---------- */
      /* Wisch-Erkennung: Zeiger (Touch/Stift, optional Maus) */
      function onSwipe(elm,h,o={}){
        if(!elm)return;let st=null;const min=o.min||56,zone=o.zone||28;
        elm.addEventListener('pointerdown',e=>{
          if(e.pointerType==='mouse'&&!o.mouse)return;
          if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable],.no-swipe'))return;
          const r=elm.getBoundingClientRect();
          if(o.edge){const dx=e.clientX-r.left,dy=e.clientY-r.top;
            const ok=o.edge==='left'?dx<=zone:o.edge==='right'?r.right-e.clientX<=zone:o.edge==='bottom'?r.bottom-e.clientY<=zone:dy<=zone;if(!ok)return}
          st={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId}},{passive:true});
        const end=e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,dt=Date.now()-st.t;st=null;
          const ax=Math.abs(dx),ay=Math.abs(dy);if(dt>900||Math.max(ax,ay)<min)return;
          const dir=ax>ay*1.4?(dx<0?'left':'right'):ay>ax*1.4?(dy<0?'up':'down'):null;if(!dir)return;
          document.dispatchEvent(new CustomEvent('olli-swipe',{detail:{dir,edge:o.edge||null}}));
          h[dir]&&h[dir](e)};
        elm.addEventListener('pointerup',end,{passive:true});elm.addEventListener('pointercancel',()=>{st=null},{passive:true});
      }
      /* Globale Gesten auf dem Desktop */
      (function(){
        const m=$('#main');if(!m)return;
        const dsk=()=>screen==='desktop'||screen==='main';
        onSwipe(m,{up:()=>{if(dsk())toggleFly('start',true)}},{edge:'bottom',zone:40,min:50,mouse:true});
        onSwipe(m,{left:()=>{if(dsk())toggleFly('cal',true)}},{edge:'right',zone:28,mouse:true});
        onSwipe(m,{right:()=>{if(dsk())toggleFly('widgets',true)}},{edge:'left',zone:28,mouse:true});
        onSwipe(m,{down:()=>{if(dsk())toggleFly('qs',true)}},{edge:'top',zone:28,mouse:true});
        FLY.forEach(id=>{const f=$('#'+id);if(!f)return;
          onSwipe(f,id==='start'?{down:()=>toggleFly(id,false)}:id==='cal'?{right:()=>toggleFly(id,false)}:id==='widgets'?{left:()=>toggleFly(id,false)}:{up:()=>toggleFly(id,false),down:()=>toggleFly(id,false)},{min:60})});
      })();

      /* Tutorial */
      function startTutorial(manual){
        if($('#tut'))return;const host=$('#main');if(!host||!host.parentNode)return;
        let i=0,done=false,poll=null;
        const D=document.createElement('div');D.id='tut';
        D.innerHTML=`<div class="spot none"></div><div class="sw"></div><div class="tc" role="dialog" aria-label="Ollidows-Tutorial"><h2></h2><p></p><div class="ok"></div><div class="go"><div class="dots"></div><span class="sp"></span><button class="btn" id="tu-s">Überspringen</button><button class="btn" id="tu-b">Zurück</button><button class="btn pri" id="tu-n">Weiter</button></div></div>`;
        host.append(D);
        const spot=$('.spot',D),tc=$('.tc',D),sw=$('.sw',D);
        const startOpen=()=>!$('#start').classList.contains('hide');
        const flyOpen=id=>!$('#'+id).classList.contains('hide');
        let gest=null;const onG=e=>{gest=e.detail};document.addEventListener('olli-swipe',onG);
        const wasSwipe=(d,edge)=>()=>!!gest&&gest.dir===d&&(!edge||gest.edge===edge);
        const STEPS=[
          {t:'Willkommen bei Ollidows 11',x:'In einer Minute zeigt dir dieses Tutorial, wie alles funktioniert: Start, Gesten, Olli-Chat und Olli Room. Du kannst es jederzeit überspringen und später in den Einstellungen unter „System“ neu starten.'},
          {t:'Das Startmenü',x:'Klicke auf die Start-Taste. Auf einem Touch-Gerät wischst du stattdessen vom unteren Rand nach oben.',sel:'#tb-start',need:startOpen,ok:'Das ist dein Startmenü.',pre:()=>toggleFly('start',false),sw:'up'},
          {t:'Schnelleinstellungen',x:'Hier stellst du Lautstärke, WLAN, Helligkeit und das helle oder dunkle Design ein.',sel:'#tb-tray',need:()=>flyOpen('qs'),ok:'Gut gemacht.',pre:()=>toggleFly('start',false)},
          {t:'Kalender und Benachrichtigungen',x:'Ein Klick auf die Uhr öffnet den Kalender. Mit dem Finger wischst du vom rechten Rand nach links. Klassentermine von Olli Room erscheinen hier automatisch.',sel:'#tb-clock',need:()=>flyOpen('cal'),ok:'Perfekt.',pre:()=>toggleFly('qs',false),sw:'left'},
          {t:'Wischen kennen',x:'Wische jetzt vom linken Rand nach rechts, um die Widgets zu öffnen. Mit der Maus ziehst du mit gedrückter Taste vom Rand.',sel:null,need:()=>flyOpen('widgets'),ok:'So einfach geht das.',pre:()=>toggleFly('cal',false),sw:'right',mouse:true},
          {t:'Olli-Chat aus dem Store',x:'Olli-Chat ist die grüne Sprechblase. Du lädst sie im Olli Store herunter. Danach siehst du alle, die gerade online sind. Chatten kannst du erst, wenn dich jemand nach einer Anfrage annimmt. Per „+“ verschickst du Word-Dateien oder Umfragen.',sel:'#tb-start',pre:()=>toggleFly('widgets',false),act:()=>{if(!APPS.ochat)openApp('store')}},
          {t:'Olli Room',x:'In den Einstellungen unter „Olli Room“ erstellst du einen Server oder trittst mit einem Code bei. Als Host siehst du alle Teilnehmer wie in einem Klassenzimmer: Bildschirme überwachen, Warnungen senden, sperren, Umfragen und Termine verschicken. Ist gerade kein Host im Panel, steht oben, dass der Server nicht aktiv ist.',sel:null},
          {t:'Gesperrt? So kommst du raus',x:'Wenn dich ein Host sperrt, siehst du einen großen Schloss-Kreis. Tippe fünfmal schnell darauf, um dich zu entsperren. Als Host kannst du das mit „Mich selbst sperren (Test)“ gefahrlos üben.',sel:null},
          {t:'Jugendschutz',x:'Eltern legen unter „Jugendschutz“ eine PIN fest und sperren Apps, den Store, Käufe und Olli-Chat. Dazu gibt es Bildschirmzeit.',sel:null},
          {t:'Du bist bereit',x:'Viel Spaß mit Ollidows 11. Das Tutorial findest du jederzeit wieder in den Einstellungen.',sel:null}
        ];
        const dots=$('.dots',D);dots.innerHTML=STEPS.map(()=>'<i></i>').join('');
        function place(r){
          const W=host.clientWidth,H=host.clientHeight,tw=Math.min(380,W-24),th=tc.offsetHeight||190;
          if(!r){tc.style.left=Math.max(12,(W-tw)/2)+'px';tc.style.top=Math.max(12,(H-th)/2)+'px';return}
          let x=r.left+r.width/2-tw/2,y=r.top-th-18;if(y<12)y=r.bottom+18;
          tc.style.left=Math.max(12,Math.min(W-tw-12,x))+'px';tc.style.top=Math.max(12,Math.min(H-th-12,y))+'px'}
        function swPos(s){
          if(!s.sw){sw.className='sw';return}
          const W=host.clientWidth,H=host.clientHeight,p={up:[W*0.78,H-120],left:[W-70,H/2-28],right:[14,H/2-28],down:[W/2-28,70]}[s.sw];
          sw.style.left=p[0]+'px';sw.style.top=p[1]+'px';sw.className='sw show '+s.sw}
        function show(n){
          i=Math.max(0,Math.min(STEPS.length-1,n));const s=STEPS[i];gest=null;clearInterval(poll);
          if(s.pre)s.pre();
          $('h2',D).textContent=s.t;$('p',D).textContent=s.x;const ok=$('.ok',D);ok.classList.remove('show');ok.textContent=s.ok||'';
          $$('.dots i',D).forEach((d,k)=>d.classList.toggle('on',k===i));
          $('#tu-b',D).style.visibility=i?'visible':'hidden';$('#tu-n',D).textContent=i===STEPS.length-1?'Los geht’s':'Weiter';$('#tu-s',D).style.display=i===STEPS.length-1?'none':'';
          const t=s.sel?$(s.sel):null,hr=host.getBoundingClientRect();
          if(t){const r=t.getBoundingClientRect(),q={left:r.left-hr.left-6,top:r.top-hr.top-6,width:r.width+12,height:r.height+12,right:r.right-hr.left+6,bottom:r.bottom-hr.top+6};
            spot.classList.remove('none');Object.assign(spot.style,{left:q.left+'px',top:q.top+'px',width:q.width+'px',height:q.height+'px'});place(q)}
          else{spot.classList.add('none');Object.assign(spot.style,{left:host.clientWidth/2+'px',top:host.clientHeight/2+'px',width:'0px',height:'0px'});if(s.sw){spot.style.boxShadow='none'}else spot.style.boxShadow='';place(null)}
          if(s.sw&&!s.sel)spot.style.boxShadow='none';else spot.style.boxShadow='';
          swPos(s);
          if(s.need){const nx=$('#tu-n',D);poll=setInterval(()=>{if(s.need()||(s.sw&&wasSwipe(s.sw)())){clearInterval(poll);ok.classList.add('show');nx.classList.add('pulse');setTimeout(()=>{if(!done&&STEPS[i]===s)show(i+1)},1100)}},180)}
          /* beim Start auf dem Tutorial-Schritt keine offenen Flyouts stehen lassen, die die Karte verdecken */
        }
        function finish(){done=true;clearInterval(poll);document.removeEventListener('olli-swipe',onG);['start','qs','cal','widgets'].forEach(id=>toggleFly(id,false));D.style.transition='opacity .4s';D.style.opacity='0';setTimeout(()=>D.remove(),420);LS.set('tut_done',1);
          if(!manual)notify('settings','Tutorial abgeschlossen','Du findest es jederzeit in den Einstellungen unter „System“.')}
        $('#tu-n',D).onclick=()=>{STEPS[i].act&&STEPS[i].act();i===STEPS.length-1?finish():show(i+1)};
        $('#tu-b',D).onclick=()=>show(i-1);$('#tu-s',D).onclick=finish;
        onSwipe(D,{left:()=>$('#tu-n',D).click(),right:()=>i&&show(i-1)},{mouse:false});
        D.addEventListener('keydown',e=>{if(e.key==='Escape')finish()});
        addEventListener('resize',()=>{if(!done)show(i)});
        show(0);
      }
      APPS.tutorial={name:'Ollidows-Tutorial',icon:I.settings,w:420,h:200,hidden:true,open:(w)=>{closeWin(w);setTimeout(()=>startTutorial(true),150)}};
      function uxStart(){
        const m=$('#main');m.classList.add('intro');setTimeout(()=>m.classList.remove('intro'),2200);
        if(!LS.get('tut_done',0))setTimeout(()=>{if(screen==='desktop'||screen==='main')startTutorial(false)},2600);
      }

      /* ---------- Init ---------- */
      applyTheme();renderTray();renderClock();boot();
      })();
    </script>
