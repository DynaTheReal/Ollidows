    $$('[data-v]',v).forEach(x=>x.onclick=()=>{const a=x.dataset.v;if(a==='close'){v.remove();w.setTitle('Fotos')}else if(a==='p')view((i-1+list.length)%list.length);else if(a==='n')view((i+1)%list.length);
      else if(a==='wall'){const src=imgSrc(f.n);$$('.wallpaper').forEach(el=>el.style.background=`url("${src}") center/cover`);notify('photos','Hintergrund festgelegt','Das Foto ist jetzt dein Desktophintergrund (bis zum nächsten Designwechsel).')}
      else if(a==='del'){const dir=nodeAt(f.p);dir.ch=dir.ch.filter(k=>k!==f.n);S.trash.push({node:f.n,from:f.p});v.remove();fsChanged()}});
    w.onkey=e=>{if(!$('.ph-view',b))return;if(e.key==='ArrowLeft')view((i-1+list.length)%list.length);if(e.key==='ArrowRight')view((i+1)%list.length);if(e.key==='Escape'){$('.ph-view',b)?.remove();w.setTitle('Fotos')}};
  }
  $('[data-a=imp]',b).onclick=()=>fileIn.click();
  fileIn.onchange=()=>{[...fileIn.files].forEach(file=>{const r=new FileReader();r.onload=()=>{const dir=nodeAt(['Bilder']);dir.ch.push(F(uniqueName(dir,file.name.replace(/\.[^.]+$/,'')+'.png'),'img',{src:r.result,d:Date.now()}));fsChanged()};r.readAsDataURL(file)})};
  w.refresh=()=>{if(!$('.ph-view',b))render()};
  render();w.setTitle('Fotos');
  if(o.name){const i=list.findIndex(f=>f.n.n===o.name&&f.p.join('/')===o.path.join('/'));if(i>=0)view(i)}
}

/* ---------- App: Clock ---------- */
function openClock(w,b){
  let tab='world',sw={run:false,t0:0,acc:0,laps:[]},tm={left:0,end:0,run:false,total:300};
  b.innerHTML=`<div class="ck"><nav class="ck-side">${[['world',I.world,'Weltzeit'],['sw',I.stopw,'Stoppuhr'],['timer',I.timer,'Timer']].map(([k,ic,n])=>`<button data-k="${k}">${ic}<span>${n}</span></button>`).join('')}</nav><div class="ck-main scroll"></div></div>`;
  const main=$('.ck-main',b);
  const fmtSW=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(c).padStart(2,'0')}`};
  const fmtTM=s=>`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(Math.floor(s)%60).padStart(2,'0')}`;
  $$('[data-k]',b).forEach(x=>x.onclick=()=>{tab=x.dataset.k;render()});
  function render(){
    $$('[data-k]',b).forEach(x=>x.classList.toggle('on',x.dataset.k===tab));
    if(tab==='world'){const Z=[['Ortszeit',undefined],['London','Europe/London'],['New York','America/New_York'],['Tokio','Asia/Tokyo'],['Sydney','Australia/Sydney'],['Los Angeles','America/Los_Angeles']];
      main.innerHTML=`<h2>Weltzeit</h2><div class="zones">${Z.map(([n,tz])=>{let t;try{t=new Date().toLocaleTimeString(DE,{hour:'2-digit',minute:'2-digit',timeZone:tz})}catch(e){t='--:--'}let d='';try{d=new Date().toLocaleDateString(DE,{weekday:'short',day:'numeric',month:'short',timeZone:tz})}catch(e){}return `<div class="zone"><small>${n}</small><b>${t}</b><small>${d}</small></div>`}).join('')}</div>`}
    else if(tab==='sw'){const ms=sw.acc+(sw.run?performance.now()-sw.t0:0);main.innerHTML=`<h2>Stoppuhr</h2><div class="sw" id="swv">${fmtSW(ms)}</div><div class="sw-btns"><button class="btn pri" data-s="go">${sw.run?'Anhalten':'Starten'}</button><button class="btn" data-s="lap" ${sw.run?'':'disabled'}>Runde</button><button class="btn" data-s="reset">Zurücksetzen</button></div><div class="laps">${sw.laps.map((l,i)=>`<div><span>Runde ${sw.laps.length-i}</span><span>${fmtSW(l)}</span></div>`).join('')}</div>`;
      $$('[data-s]',main).forEach(x=>x.onclick=()=>{const a=x.dataset.s;if(a==='go'){if(sw.run){sw.acc+=performance.now()-sw.t0;sw.run=false}else{sw.t0=performance.now();sw.run=true}}else if(a==='lap')sw.laps.unshift(sw.acc+performance.now()-sw.t0);else{sw={run:false,t0:0,acc:0,laps:[]}}render()})}
    else{const left=tm.run?Math.max(0,(tm.end-Date.now())/1000):tm.left||tm.total;main.innerHTML=`<h2>Timer</h2><div class="sw" id="tmv">${fmtTM(Math.ceil(left))}</div><div class="sw-btns" style="margin-bottom:14px">${[1,3,5,10,15].map(m=>`<button class="btn" data-m="${m}" ${tm.run?'disabled':''}>${m} Min.</button>`).join('')}</div><div class="sw-btns"><button class="btn pri" data-t="go">${tm.run?'Pause':'Starten'}</button><button class="btn" data-t="reset">Zurücksetzen</button></div>`;
      $$('[data-m]',main).forEach(x=>x.onclick=()=>{tm.total=+x.dataset.m*60;tm.left=0;render()});
      $$('[data-t]',main).forEach(x=>x.onclick=()=>{if(x.dataset.t==='go'){if(tm.run){tm.left=Math.max(0,(tm.end-Date.now())/1000);tm.run=false}else{tm.end=Date.now()+(tm.left||tm.total)*1000;tm.run=true}}else{tm.run=false;tm.left=0}render()})}
  }
  const iv=setInterval(()=>{if(tab==='sw'&&sw.run){const v=$('#swv',main);if(v)v.textContent=fmtSW(sw.acc+performance.now()-sw.t0)}
    if(tm.run){const left=(tm.end-Date.now())/1000;if(left<=0){tm.run=false;tm.left=0;notify('clock','Timer abgelaufen',`${Math.round(tm.total/60)} Minuten sind um.`);tone([880,660,880,660],1.2,.15);if(tab==='timer')render()}else if(tab==='timer'){const v=$('#tmv',main);if(v)v.textContent=fmtTM(Math.ceil(left))}}
    if(tab==='world'&&new Date().getSeconds()===0)render()},50);
  w.onclose=()=>clearInterval(iv);render();
}

/* ---------- App: Mines ---------- */
function openMines(w,b){
  const R=9,C=9,M=10;let grid,over,started,flags,flagMode=false,t=0,tid=null,opened;
  b.innerHTML=`<div class="mn"><div class="mn-top"><span class="cnt" id="mc">010</span><button class="mn-face" aria-label="Neues Spiel">🙂</button><span class="cnt" id="mt">000</span></div><div class="mn-g"></div><button class="btn mn-flag">🚩 Flaggen-Modus: Aus</button></div>`;
  const G=$('.mn-g',b),face=$('.mn-face',b);
  const pad=n=>String(Math.max(-99,Math.min(999,n))).padStart(3,'0');
  function reset(){clearInterval(tid);t=0;over=false;started=false;flags=0;opened=0;grid=[...Array(R*C)].map(()=>({m:false,o:false,f:false,n:0}));face.textContent='🙂';$('#mt',b).textContent='000';$('#mc',b).textContent=pad(M);draw()}
  function place(skip){let k=0;while(k<M){const i=Math.floor(Math.random()*R*C);if(grid[i].m||Math.abs(i%C-skip%C)<=1&&Math.abs(Math.floor(i/C)-Math.floor(skip/C))<=1)continue;grid[i].m=true;k++}grid.forEach((c,i)=>c.n=nb(i).filter(j=>grid[j].m).length)}
  const nb=i=>{const r=Math.floor(i/C),c=i%C,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)o.push(rr*C+cc)}return o};
  function open(i){const c=grid[i];if(c.o||c.f||over)return;if(!started){started=true;place(i);tid=setInterval(()=>{t++;$('#mt',b).textContent=pad(t)},1000)}
    c.o=true;opened++;if(c.m){over=true;c.boom=true;grid.forEach(x=>{if(x.m)x.o=true});clearInterval(tid);face.textContent='😵';draw();return}
    if(c.n===0)nb(i).forEach(open);
    if(opened===R*C-M&&!over){over=true;clearInterval(tid);face.textContent='😎';grid.forEach(x=>{if(x.m)x.f=true});notify('mines','Gewonnen!',`Du hast alle Minen in ${t} Sekunden gefunden.`)}}
  function flag(i){const c=grid[i];if(c.o||over)return;c.f=!c.f;flags+=c.f?1:-1;$('#mc',b).textContent=pad(M-flags);draw()}
  function draw(){G.innerHTML='';grid.forEach((c,i)=>{const x=el('button',(c.o?'r':'')+(c.boom?' boom':'')+(c.o&&c.n&&!c.m?' c'+c.n:''),c.o?(c.m?'💣':c.n||''):c.f?'🚩':'');x.setAttribute('aria-label','Feld '+(i+1));
    let lp=null,lpd=false;
    x.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){lpd=false;lp=setTimeout(()=>{lpd=true;flag(i)},420)}else if(!over)face.textContent='😮'});
    x.addEventListener('pointerup',()=>{clearTimeout(lp);if(!over)face.textContent='🙂'});x.addEventListener('pointerleave',()=>clearTimeout(lp));
    x.onclick=()=>{if(lpd){lpd=false;return}if(flagMode)flag(i);else{open(i);draw()}};
    x.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();flag(i)};G.append(x)})}
  face.onclick=reset;
  $('.mn-flag',b).onclick=e=>{flagMode=!flagMode;e.currentTarget.textContent='🚩 Flaggen-Modus: '+(flagMode?'Ein':'Aus');e.currentTarget.classList.toggle('pri',flagMode)};
  w.onclose=()=>clearInterval(tid);reset();
}

function openDemo(w,b,c){b.innerHTML=`<div class="demo">${letterIcon(c.color,c.name[0])}<b>${esc(c.name)}</b><p>${esc(c.cat)} · Diese App ist eine Demo aus dem Olli Store. Sie startet und erscheint in der Taskleiste, hat aber keine weiteren Funktionen.</p><button class="btn pri">Okay</button></div>`;$('.btn',b).onclick=()=>closeWin(w)}

/* ---------- Keyboard ---------- */
let metaAlone=false;
document.addEventListener('keydown',e=>{
  if(screen==='lock'){if(!$('#lock').classList.contains('auth'))authLock();else if(e.key==='Enter'&&$('#signin'))signIn();else if(e.key==='Escape'){$('#lock').classList.remove('auth');$('#login').innerHTML=''}return}
  if(screen!=='main')return;
  if(e.key==='Meta'||e.key==='OS'){metaAlone=true;return}metaAlone=false;
  if(e.key==='Escape'){closeAll();return}
  const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(active&&!active.min&&active.onkey)active.onkey(e);
});
document.addEventListener('keyup',e=>{if((e.key==='Meta'||e.key==='OS')&&metaAlone&&screen==='main'){toggleFly('start')}metaAlone=false});

/* ---------- Tick ---------- */
function tick(){const d=new Date();$('#lk-t').textContent=fT(d);$('#lk-d').textContent=d.toLocaleDateString(DE,{weekday:'long',day:'numeric',month:'long'});if(screen==='main'){renderClock()}}
setInterval(tick,1000);

/* ---------- Init ---------- */
applyTheme();renderTray();renderClock();boot();
})();
