<title>Ollidows 11</title>
<style>
      /* Layout: full-screen OS shell — wallpaper, desktop icons, floating windows, centered taskbar, acrylic flyouts */
      :root{
        --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
        --bg:#000;--solid:#f3f3f3;--card:#fbfbfb;--card2:#fff;--text:#1a1a1a;--text2:#5d5d5d;--text3:#8a8a8a;
        --border:rgba(0,0,0,.09);--hover:rgba(0,0,0,.045);--press:rgba(0,0,0,.08);
        --acrylic:rgba(243,243,245,.84);--tb:rgba(238,239,242,.84);--input:#fff;
        --shadow:0 10px 36px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.08);
        --accent:#0067c0;--on-accent:#fff;--danger:#c42b1c;--ok:#0f7b0f;
      }
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
        --solid:#202020;--card:#2b2b2b;--card2:#323232;--text:#fff;--text2:#c8c8c8;--text3:#8d8d8d;
        --border:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.1);
        --acrylic:rgba(36,36,38,.84);--tb:rgba(28,28,30,.86);--input:#2d2d2d;
        --shadow:0 10px 36px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
        --accent:#4cc2ff;--on-accent:#000;--danger:#ff6b5b;--ok:#6ccb5f;color-scheme:dark}}
      :root[data-theme="dark"],#os.dark{
        --solid:#202020;--card:#2b2b2b;--card2:#323232;--text:#fff;--text2:#c8c8c8;--text3:#8d8d8d;
        --border:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.1);
        --acrylic:rgba(36,36,38,.84);--tb:rgba(28,28,30,.86);--input:#2d2d2d;
        --shadow:0 10px 36px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
        --accent:#4cc2ff;--on-accent:#000;--danger:#ff6b5b;--ok:#6ccb5f;color-scheme:dark}
      #os.light{
        --solid:#f3f3f3;--card:#fbfbfb;--card2:#fff;--text:#1a1a1a;--text2:#5d5d5d;--text3:#8a8a8a;
        --border:rgba(0,0,0,.09);--hover:rgba(0,0,0,.045);--press:rgba(0,0,0,.08);
        --acrylic:rgba(243,243,245,.84);--tb:rgba(238,239,242,.84);--input:#fff;
        --shadow:0 10px 36px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.08);
        --accent:#0067c0;--on-accent:#fff;--danger:#c42b1c;--ok:#0f7b0f;color-scheme:light}
      [hidden]{display:none!important}
      html,body{height:100%;background:var(--bg)}
      body{overflow:hidden}
      *{box-sizing:border-box}
      button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;-webkit-tap-highlight-color:transparent}
      button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
      input,textarea{font:inherit;color:var(--text)}
      #os{position:fixed;inset:0;overflow:hidden;font-family:var(--font);font-size:14px;color:var(--text);user-select:none;-webkit-user-select:none;background:#000}
      #os input,#os textarea{user-select:text;-webkit-user-select:text}
      .screen{position:absolute;inset:0}
      .wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .5s}
      svg{display:block}

      /* Boot */
      #boot{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
      #boot .blogo{width:128px;height:128px;animation:fadein .8s ease both}
      #boot .bname{color:#fff;margin-top:22px;font-size:15px;letter-spacing:.06em;opacity:.85;animation:fadein .8s .3s ease both}
      .spin{position:relative;width:36px;height:36px;margin-top:80px}
      .spin span{position:absolute;inset:0;animation:spin 2.2s cubic-bezier(.5,.15,.35,.9) infinite}
      .spin span::before{content:"";position:absolute;left:50%;top:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
      .spin span:nth-child(2){animation-delay:.12s}.spin span:nth-child(3){animation-delay:.24s}.spin span:nth-child(4){animation-delay:.36s}.spin span:nth-child(5){animation-delay:.48s}
      #boot .spin{color:#fff}
      @keyframes spin{0%{transform:rotate(0)}60%{transform:rotate(330deg)}100%{transform:rotate(720deg)}}
      @keyframes fadein{from{opacity:0}to{opacity:1}}

      /* Lock / login */
      #lock{overflow:hidden}
      #lock .wallpaper{transition:filter .4s,transform .4s}
      #lock.auth .wallpaper{filter:blur(28px) brightness(.75);transform:scale(1.08)}
      .lk-clock{position:absolute;left:0;right:0;top:calc(11vh + env(safe-area-inset-top,0px));text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3);transition:opacity .3s,transform .3s}
      .lk-clock .t{font-size:clamp(72px,16vw,120px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
      .lk-clock .d{font-size:clamp(16px,3.4vw,22px);margin-top:10px}
      #lock.auth .lk-clock{opacity:0;transform:translateY(-40px)}
      .lk-hint{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;transition:opacity .3s}
      #lock.auth .lk-hint{opacity:0}
      .login{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
      #lock.auth .login{opacity:1;pointer-events:auto}
      .login .ava{width:176px;height:176px;font-size:64px}
      .login .nm{font-size:26px;font-weight:600;margin-top:6px}
      .login .signin{margin-top:10px;min-width:180px;height:36px;border-radius:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;backdrop-filter:blur(10px)}
      .login .signin:hover{background:rgba(255,255,255,.26)}
      .login .welcome{display:flex;flex-direction:column;align-items:center;gap:0;font-size:22px}
      .login .welcome .spin{margin-top:22px;color:#fff}

      /* Taskbar */
      #taskbar{position:absolute;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));background:var(--tb);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);border-top:1px solid var(--border);display:flex;align-items:center;gap:4px;z-index:9000}

      /* Flyouts */

      #start{left:50%;width:min(640px,calc(100vw - 16px));height:min(720px,calc(100% - 76px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px)));transform:translateX(-50%);display:flex;flex-direction:column}

      .st-search{margin:24px 28px 8px;height:36px;border-radius:18px;background:var(--input);border:1px solid var(--border);border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:10px;padding:0 14px;flex:0 0 auto}

      @media (max-width:560px){.st-grid{grid-template-columns:repeat(4,1fr)}.st-rec{grid-template-columns:1fr}.st-foot{padding:0 14px}.st-search{margin:16px 16px 6px}.st-body{padding:4px 8px 12px}}

      #qs{right:max(12px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 16px));transform:translateY(0)}

      .batt{display:flex;align-items:center;gap:8px}

      #cal{right:max(12px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 16px));max-height:calc(100% - 76px);display:flex;flex-direction:column;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;gap:10px;overflow:visible}
      #cal.hide{transform:translateX(40px)}
      #cal>div{background:var(--acrylic);backdrop-filter:blur(40px) saturate(1.7);-webkit-backdrop-filter:blur(40px) saturate(1.7);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
      .nt-box{min-height:120px;max-height:24vh;overflow:auto;display:flex;flex-direction:column}

      #widgets{left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(560px,calc(100vw - 16px));transform:translateX(0);display:flex;flex-direction:column}

      /* Context menu */
      .ctx{position:absolute;z-index:9900;min-width:220px;padding:4px;background:var(--acrylic);backdrop-filter:blur(40px) saturate(1.7);-webkit-backdrop-filter:blur(40px) saturate(1.7);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);animation:pop .14s ease}

      /* Toast */
      #toasts{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:9600;display:flex;flex-direction:column;gap:8px;width:min(364px,calc(100vw - 24px));pointer-events:none}

      .ex-tbl td{padding:5px 10px;white-space:nowrap}
      .ex-row{border:1px solid transparent}
      .ex-row td:first-child{display:flex;align-items:center;gap:10px}
      .ex-row td:first-child svg,.ex-row td:first-child img{width:20px;height:20px;object-fit:cover}
      .ex-row td:not(:first-child){color:var(--text2)}
      .ex-sec{font-size:13px;font-weight:600;margin:10px 2px 8px}
      .drive{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:5px;width:min(320px,100%);text-align:left}
      .drive:hover{background:var(--hover)}
      .drive svg{width:44px;height:44px;flex:0 0 auto}
      .drive .bar{height:6px;border-radius:3px;background:var(--press);margin:6px 0 4px;overflow:hidden}
      .drive .bar i{display:block;height:100%;background:var(--accent)}
      .drive small{color:var(--text2);font-size:11.5px}
      .drives{display:flex;flex-wrap:wrap;gap:4px}
      .ex-status{height:26px;flex:0 0 auto;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--text2);border-top:1px solid var(--border)}
      .ren{width:100%;font-size:12.5px;padding:2px 4px;border:1px solid var(--accent);background:var(--input);outline:none;text-align:center}
      @media (max-width:640px){.ex-side{display:none}.ex-search{width:110px}}

      /* Notepad */
      .np-menu{display:flex;gap:2px;padding:4px 6px;flex:0 0 auto;border-bottom:1px solid var(--border)}
      .np-menu button{padding:5px 10px;border-radius:4px;font-size:13px}
      .np-menu button:hover{background:var(--hover)}
      .np-ta{flex:1;min-height:0;resize:none;border:0;outline:none;padding:10px 14px;background:var(--card);font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:15px;line-height:1.45;color:var(--text)}
      .np-ta.nowrap{white-space:pre;overflow-x:auto}
      .np-st{height:28px;flex:0 0 auto;display:flex;align-items:center;font-size:12px;color:var(--text2);border-top:1px solid var(--border);overflow:hidden;white-space:nowrap}
      .np-st span{padding:0 14px;border-left:1px solid var(--border)}
      .np-st span:first-child{border-left:0;flex:1}

      /* Calculator */
      .calc{flex:1;display:flex;flex-direction:column;padding:4px 4px 4px;min-height:0}
      .calc-h{display:flex;align-items:center;gap:8px;padding:4px 8px 0;font-size:20px;font-weight:600}
      .calc-line{min-height:20px;text-align:right;padding:6px 14px 0;color:var(--text2);font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
      .calc-val{text-align:right;padding:2px 14px 10px;font-size:46px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
      .calc-mem{display:flex;gap:2px;padding:0 4px 4px}
      .calc-mem span{flex:1;text-align:center;font-size:12px;padding:6px 0;color:var(--text3)}
      .calc-k{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:2px;min-height:0}
      .calc-k button{border-radius:5px;background:var(--card);border:1px solid var(--border);font-size:16px}
      .calc-k button.n{background:var(--card2);font-weight:600;font-size:18px}
      .calc-k button:hover{filter:brightness(.97)}
      #os.dark .calc-k button:hover{filter:brightness(1.15)}
      .calc-k button.eq{background:var(--accent);color:var(--on-accent);border-color:transparent;font-size:22px}

      /* Settings */
      .set{flex:1;min-height:0;display:flex}
      .set-side{width:270px;flex:0 0 auto;padding:6px 10px 16px;overflow:auto}
      .set-user{display:flex;align-items:center;gap:14px;padding:10px 8px 16px}
      .set-user .ava{width:62px;height:62px;font-size:24px}
      .set-user b{display:block;font-weight:600}
      .set-user small{color:var(--text2);font-size:12px}
      .set-side .inp{width:100%;margin-bottom:8px}
      .set-nav{display:flex;align-items:center;gap:14px;width:100%;height:36px;padding:0 12px;border-radius:5px;text-align:left;font-size:13.5px;position:relative}
      .set-nav:hover{background:var(--hover)}
      .set-nav.on{background:var(--press)}
      .set-nav.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
      .set-nav svg{width:18px;height:18px}
      .set-main{flex:1;min-width:0;padding:14px 28px 30px}
      .set-main h1{font-size:28px;font-weight:600;margin:4px 0 18px}
      .set-main h3{font-size:14px;font-weight:600;margin:20px 0 8px}
      .srow{display:flex;align-items:center;gap:16px;min-height:66px;padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:3px}
      .srow.click:hover{background:var(--card2)}
      .sico{width:22px;display:grid;place-items:center;flex:0 0 auto;color:var(--text2)}
      .sico svg{width:20px;height:20px}
      .stxt{flex:1;min-width:0}
      .stxt b{display:block;font-weight:400;font-size:14px}
      .stxt small{color:var(--text2);font-size:12px}
      .sctl{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
      .tg{position:relative;width:40px;height:20px;flex:0 0 auto}
      .tg input{position:absolute;opacity:0;inset:0;margin:0}
      .tg span{position:absolute;inset:0;border-radius:10px;border:1px solid var(--text2);transition:.15s}
      .tg span::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:.15s}
      .tg input:checked+span{background:var(--accent);border-color:var(--accent)}
      .tg input:checked+span::after{left:23px;background:var(--on-accent)}
      .tg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
      .set-hero{display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
      .set-hero .pv{width:180px;aspect-ratio:16/10;max-width:100%;border-radius:8px;background-size:cover;background-position:center;border:4px solid #222;box-shadow:var(--shadow)}
      .set-hero b{font-size:20px;font-weight:600;display:block}
      .set-hero small{color:var(--text2)}
      .walls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0 4px}
      .walls button{width:96px;aspect-ratio:16/10;border-radius:6px;background-size:cover;background-position:center;border:2px solid transparent;max-width:100%}
      .walls button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--card)}
      .accs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
      .accs button{width:34px;height:34px;border-radius:5px;border:2px solid transparent}
      .accs button.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--card)}
      .seg{display:flex;gap:6px;flex-wrap:wrap}
      .seg button{height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--border);background:var(--card2);font-size:13px}
      .seg button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
      .upd{display:flex;align-items:center;gap:18px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:16px;flex-wrap:wrap}
      .upd svg{width:54px;height:54px}
      .upd .tx{flex:1;min-width:180px}
      .upd b{font-size:18px;font-weight:600;display:block}
      .upd small{color:var(--text2)}
      .pbar{height:4px;border-radius:2px;background:var(--press);overflow:hidden;margin-top:10px}
      .pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
      .set-burger{display:none}
      @media (max-width:720px){
        .set-side{position:absolute;inset:0;z-index:4;background:var(--solid);width:100%;display:none}
        .set.navopen .set-side{display:block}
        .set-burger{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:5px;margin:6px 0 0 10px}
        .set-burger:hover{background:var(--hover)}
        .set-main{padding:4px 16px 24px}
        .set-main h1{font-size:24px}
      }

      /* Paint */
      .pt-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;flex:0 0 auto;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--card)}
      .pt-bar .grp{display:flex;align-items:center;gap:2px;padding-right:8px;border-right:1px solid var(--border)}
      .pt-bar .grp:last-child{border-right:0}
      .pt-tool{width:34px;height:34px;border-radius:5px;display:grid;place-items:center}
      .pt-tool svg{width:18px;height:18px}
      .pt-tool:hover{background:var(--hover)}
      .pt-tool.on{background:var(--press);box-shadow:inset 0 -2px 0 var(--accent)}
      .pt-col{width:20px;height:20px;border-radius:50%;border:1px solid var(--border)}
      .pt-col.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
      .pt-cur{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);margin-right:6px}
      .pt-wrap{flex:1;min-height:0;background:#cdd3dc;position:relative;overflow:hidden}
      #os.dark .pt-wrap{background:#151515}
      .pt-wrap canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
      .pt-size{width:90px}

      /* Terminal */
      .term-tabs{display:flex;align-items:flex-end;height:38px;padding:0 6px;background:#1b1b1b;color:#fff;flex:0 0 auto}
      .term-tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px 6px 0 0;background:#0c0c0c;font-size:12px}
      .term-tab svg{width:14px;height:14px}
      .term{flex:1;min-height:0;background:#0c0c0c;color:#ccc;font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:14px;line-height:1.4;padding:8px 12px;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
      .term .ln{display:flex}
      .term input{flex:1;min-width:0;background:none;border:0;outline:none;color:inherit;font:inherit;padding:0;caret-color:#ccc}
      .term .err{color:#f14c4c}.term .acc{color:#3b8eea}.term .yl{color:#e5e510}.term .gr{color:#23d18b}

      /* Browser */
      .br-tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;flex:0 0 auto;background:var(--solid);overflow-x:auto;scrollbar-width:none;min-width:0}
      .br-tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;width:200px;flex:0 1 200px;min-width:90px;border-radius:7px 7px 0 0;font-size:12px}
      .br-tab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
      .br-tab svg{width:16px;height:16px;flex:0 0 auto}
      .br-tab .tx{width:22px;height:22px;border-radius:4px;display:grid;place-items:center}
      .br-tab .tx svg{width:9px;height:9px}
      .br-tab .tx:hover{background:var(--hover)}
      .br-tab:hover{background:var(--hover)}
      .br-tab.on{background:var(--card)}
      .br-new{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto;margin-bottom:2px}
      .br-new:hover{background:var(--hover)}
      .br-new svg{width:14px;height:14px}
      .br-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto}
      .br-bar>button{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto}
      .br-bar>button:hover{background:var(--hover)}
      .br-bar>button:disabled{color:var(--text3)}
      .br-bar svg{width:16px;height:16px}
      .br-url{flex:1;min-width:0;height:32px;border-radius:16px;border:1px solid var(--border);background:var(--input);padding:0 14px;outline:none;font-size:13px}
      .br-url:focus{border-color:var(--accent)}
      .br-page{flex:1;min-height:0;overflow:auto;background:var(--card2)}
      .bp{max-width:900px;margin:0 auto;padding:28px 22px 40px}
      .bp-start{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8vh 18px 30px;gap:22px;background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent)}
      .bp-start .hi{font-size:clamp(22px,4vw,30px);font-weight:600;text-align:center}
      .bp-search{width:min(620px,100%);height:48px;border-radius:24px;background:var(--input);border:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;padding:0 18px}
      .bp-search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px}
      .bp-search svg{width:18px;height:18px;color:var(--text2)}
      .bp-tiles{display:grid;grid-template-columns:repeat(auto-fit,96px);gap:12px;justify-content:center;width:min(560px,100%)}
      .bp-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:8px;font-size:12px}
      .bp-tile:hover{background:var(--hover)}
      .bp-tile i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:18px}
      .bp h2{font-size:24px;margin:0 0 6px;font-weight:600}
      .bp .meta{color:var(--text2);font-size:13px;margin-bottom:20px}
      .bp p{line-height:1.6;max-width:65ch}
      .sr{padding:14px 0;border-bottom:1px solid var(--border)}
      .sr .u{font-size:12px;color:var(--text2)}
      .sr a,.sr button.lk{color:var(--accent);font-size:17px;text-decoration:none;display:block;margin:3px 0;text-align:left}
      .sr a:hover,.sr button.lk:hover{text-decoration:underline}
      .sr p{margin:2px 0;font-size:13.5px;color:var(--text2)}
      .bp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
      .bp-card{border-radius:8px;border:1px solid var(--border);background:var(--card);overflow:hidden;text-align:left}
      .bp-card i{display:block;height:110px}
      .bp-card div{padding:12px 14px}
      .bp-card b{display:block;margin-bottom:4px;font-weight:600}
      .bp-card small{color:var(--text2)}


      /* Store */
      .sto{flex:1;min-height:0;display:flex}
      .sto-side{width:72px;flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:8px 6px}
      .sto-side button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:5px;font-size:10.5px;position:relative}
      .sto-side button svg{width:20px;height:20px}
      .sto-side button:hover{background:var(--hover)}
      .sto-side button.on{background:var(--press)}
      .sto-side button.on::before{content:"";position:absolute;left:0;top:12px;bottom:28px;width:3px;border-radius:2px;background:var(--accent)}
      .sto-main{flex:1;min-width:0;background:var(--card);border-top-left-radius:8px;border-left:1px solid var(--border);border-top:1px solid var(--border);padding:20px 24px 30px}
      .sto-hero{border-radius:10px;padding:28px;min-height:190px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;margin-bottom:22px;background:linear-gradient(120deg,#16324f,#3b6fd6 55%,#7fc0ff)}
      .sto-hero b{font-size:clamp(22px,4vw,30px);font-weight:700}
      .sto-hero .btn{align-self:flex-start;background:#fff;color:#111;border:0;margin-top:6px}
      .sto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
      .sto-app{display:flex;gap:12px;align-items:center;padding:14px;border-radius:8px;background:var(--card2);border:1px solid var(--border);min-width:0}
      .sto-app svg{width:48px;height:48px;flex:0 0 auto}
      .sto-app .tx{flex:1;min-width:0}
      .sto-app b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .sto-app small{display:block;color:var(--text2);font-size:12px}
      .sto-app .btn{height:28px;padding:0 10px;font-size:12px;margin-top:8px;min-width:96px;position:relative;overflow:hidden;white-space:nowrap}
      .sto-app .btn i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s}
      .sto-main.still>*,.sto-main.still .sto-app{animation:none!important}
      .app-ic{display:block;width:24px;height:24px;border-radius:22%;object-fit:cover;flex:0 0 auto}
      .tbtn .app-ic{width:24px;height:24px}.st-app .app-ic,.rec .app-ic{width:32px;height:32px}.st-li .app-ic{width:24px;height:24px}
      .tbi .app-ic{width:16px;height:16px;margin:0 10px 0 12px;border-radius:4px}.res-best .app-ic{width:48px;height:48px}
      .dicon .app-ic{width:var(--isz,44px);height:var(--isz,44px)}.srow .app-ic{width:22px;height:22px}
      .stars{color:var(--text2);font-size:11.5px}

      /* Photos */
      .ph{flex:1;min-height:0;display:flex;flex-direction:column}
      .ph-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px;flex:0 0 auto}
      .ph-head b{font-size:22px;font-weight:600}
      .ph-grid{flex:1;padding:8px 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;align-content:start}
      .ph-grid button{aspect-ratio:4/3;border-radius:5px;overflow:hidden;background:var(--press)}
      .ph-grid img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
      .ph-grid button:hover img{transform:scale(1.04)}
      .ph-view{position:absolute;inset:0;background:#111;display:flex;flex-direction:column;z-index:3}
      .ph-view .img{flex:1;min-height:0;display:grid;place-items:center;position:relative}
      .ph-view img{max-width:100%;max-height:100%;object-fit:contain}
      .ph-view .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#fff;font-size:13px}
      .ph-view .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .ph-view button{color:#fff;width:36px;height:36px;border-radius:5px;display:grid;place-items:center}
      .ph-view button:hover{background:rgba(255,255,255,.12)}
      .ph-view button svg{width:16px;height:16px}
      .ph-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4)!important}
      .ph-nav.p{left:10px}.ph-nav.n{right:10px}

      /* Clock */
      .ck{flex:1;min-height:0;display:flex}
      .ck-side{width:180px;flex:0 0 auto;padding:8px}
      .ck-side button{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;border-radius:5px;font-size:13px;position:relative}
      .ck-side button:hover{background:var(--hover)}
      .ck-side button.on{background:var(--press)}
      .ck-side button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
      .ck-side svg{width:16px;height:16px}
      .ck-main{flex:1;min-width:0;padding:20px 24px;background:var(--card);border-left:1px solid var(--border)}
      .ck-main h2{margin:0 0 16px;font-size:22px;font-weight:600}
      .zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
      .zone{padding:16px;border-radius:8px;background:var(--card2);border:1px solid var(--border)}
      .zone b{display:block;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
      .zone small{color:var(--text2)}
      .sw{font-size:clamp(44px,9vw,72px);font-weight:600;text-align:center;font-variant-numeric:tabular-nums;padding:24px 0 16px}
      .sw-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
      .laps{max-width:360px;margin:20px auto 0;font-variant-numeric:tabular-nums;font-size:13px}
      .laps div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--border)}
      @media (max-width:600px){.ck{flex-direction:column}.ck-side{width:auto;display:flex}.ck-main{border-left:0;border-top:1px solid var(--border)}}

      /* Mines */
      .mn{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;background:var(--card);overflow:auto}
      .mn-top{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
      .mn-top .cnt{min-width:54px;text-align:center;padding:4px 8px;border-radius:4px;background:#1a1a1a;color:#ff4a3d;font-family:Consolas,monospace;font-size:20px;font-weight:700}
      .mn-face{width:40px;height:40px;border-radius:6px;background:var(--card2);border:1px solid var(--border);font-size:22px}
      .mn-g{display:grid;grid-template-columns:repeat(9,30px);gap:2px;touch-action:manipulation}
      .mn-g button{width:30px;height:30px;border-radius:4px;background:linear-gradient(#9ec3f0,#7aa6de);font-weight:700;font-size:15px;color:#fff}
      .mn-g button:hover{filter:brightness(1.07)}
      .mn-g button.r{background:var(--card2);border:1px solid var(--border)}
      .mn-g button.boom{background:#e0453a}
      .mn-flag{font-size:12px}
      .c1{color:#1976d2!important}.c2{color:#388e3c!important}.c3{color:#d32f2f!important}.c4{color:#7b1fa2!important}.c5{color:#ff8f00!important}.c6{color:#0097a7!important}.c7{color:#424242!important}.c8{color:#9e9e9e!important}

      .lk-ann p{margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

      #ann{position:absolute;inset:0;z-index:20000;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}

      /* Kalender: Termine */

      .capp{flex:1;min-height:0;display:flex}

      .capp-h{display:flex;align-items:center;gap:6px}

      const PHOTO_CACHE={};
      function genPhoto(i){
        if(PHOTO_CACHE[i])return PHOTO_CACHE[i];
        const P=[['#6ec6ff','#e8f7ff','#ffd36b','#e6c48a','#2b9fd6','beach'],['#8ab4e8','#eef4ff','#fff3c4','#5d7290','#36475e','mount'],['#ff7a59','#ffd29c','#fff0b0','#7a3355','#3d1c3a','hills'],['#7fc2ef','#d8efff','#fff8d6','#2f7fb2','#1f5a80','lake'],['#9b8cff','#ffc6e7','#fff','#6c55d6','#3c2c9a','hills'],['#a8d8a0','#f1fbe8','#fffad0','#2f7d45','#174d2b','forest'],['#f6b26b','#ffe8c7','#fff6d9','#d68a3c','#a85c22','dunes'],['#0b1a3a','#1f4b6e','#bfffe6','#0f2a44','#08162a','aurora']][i%8];
        const c=document.createElement('canvas');c.width=640;c.height=420;const x=c.getContext('2d');
        let seed=i*9301+49297;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
        let g=x.createLinearGradient(0,0,0,420);g.addColorStop(0,P[0]);g.addColorStop(1,P[1]);x.fillStyle=g;x.fillRect(0,0,640,420);
        if(P[5]==='aurora'){for(let k=0;k<3;k++){x.beginPath();x.moveTo(0,120+k*30);for(let X=0;X<=640;X+=20)x.lineTo(X,90+k*30+Math.sin(X/70+k)*30);x.lineTo(640,0);x.lineTo(0,0);x.closePath();const ag=x.createLinearGradient(0,40,0,200);ag.addColorStop(0,'rgba(80,255,190,0)');ag.addColorStop(1,'rgba(80,255,190,.35)');x.fillStyle=ag;x.fill()}for(let k=0;k<80;k++){x.fillStyle='rgba(255,255,255,'+(.4+rnd()*.6)+')';x.fillRect(rnd()*640,rnd()*220,1.5,1.5)}}
        else{x.fillStyle=P[2];x.globalAlpha=.9;x.beginPath();x.arc(160+rnd()*320,90+rnd()*60,38,0,7);x.fill();x.globalAlpha=1}
        const layers=P[5]==='mount'?[[P[3],170,120,.004,'peak'],[P[4],250,70,.006,'peak']]:P[5]==='beach'?[[P[4],250,6,.02],[P[3],300,10,.01]]:P[5]==='lake'?[[P[3],230,40,.01],[P[4],290,4,.02]]:[[P[3],230,40,.008],[P[4],300,35,.012]];
        layers.forEach(([col,base,amp,f,type],k)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,420);for(let X=0;X<=640;X+=8){const y=type==='peak'?base-Math.abs(Math.sin(X*f*3+k*2))*amp:base+Math.sin(X*f+k*3)*amp+Math.sin(X*f*2.7)*amp*.4;x.lineTo(X,y)}x.lineTo(640,420);x.closePath();x.fill()});
        if(P[5]==='forest'){x.fillStyle='#0f3a1f';for(let k=0;k<26;k++){const X=k*26+rnd()*10,h=60+rnd()*60,y=330;x.beginPath();x.moveTo(X,y-h);x.lineTo(X-16,y);x.lineTo(X+16,y);x.fill()}x.fillRect(0,328,640,92)}
        return PHOTO_CACHE[i]=c.toDataURL('image/jpeg',.85);
      }

      /* ---------- Window manager ---------- */
      const area=$('#winarea');let wins=[],Z=10,active=null,cascade=0;
      const small=()=>area.clientWidth<700;
      function openApp(id,opts={}){
        const app=APPS[id];if(!app)return;closeAll();
        if(app.single){const ex=wins.find(w=>w.app===id);if(ex){focusWin(ex);ex.handle&&ex.handle(opts);return ex}}
        const w={app:id,min:false,max:false,z:0};
        const d=el('div','win opening');w.d=d;
        const AW=area.clientWidth,AH=area.clientHeight;
        const W=Math.min(app.w||800,AW-24),H=Math.min(app.h||520,AH-24);
        const off=(cascade++%6)*28;
        const L=Math.max(0,Math.min((AW-W)/2-60+off,AW-W)),T=Math.max(0,Math.min((AH-H)/2-40+off,AH-H));
        Object.assign(d.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});
        d.innerHTML=`<div class="tb"><span class="tbi">${app.icon}</span><span class="tbt">${esc(app.name)}</span><div class="tbb"><button data-a="min" aria-label="Minimieren">${I.minw}</button><button data-a="max" aria-label="Maximieren">${I.maxw}</button><button data-a="close" class="x" aria-label="Schließen">${I.x}</button></div></div><div class="wb"></div><div class="rz r" data-r="r"></div><div class="rz b" data-r="b"></div><div class="rz rb" data-r="rb"></div>`;
        area.append(d);wins.push(w);
        w.body=$('.wb',d);w.setTitle=t=>{$('.tbt',d).textContent=t};
        d.addEventListener('pointerdown',()=>{if(active!==w)focusWin(w)},true);
        $$('.tbb button',d).forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.a;if(a==='min')minimizeWin(w);else if(a==='max')toggleMax(w);else closeWin(w)});
        bindDrag(w);bindResize(w);
        if(small())setMax(w,true);
        try{app.open(w,w.body,opts)}catch(err){console.error(err);w.body.innerHTML=`<div class="demo"><b>App-Fehler</b><p>${esc(err.message)}</p></div>`}
        focusWin(w);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.remove('opening')));
        return w;
      }
      function focusWin(w){w.min=false;w.d.classList.remove('min');w.z=++Z;w.d.style.zIndex=w.z;wins.forEach(x=>x.d.classList.toggle('active',x===w));active=w;renderTaskbar()}
      function topWin(){return wins.filter(w=>!w.min).sort((a,b)=>b.z-a.z)[0]||null}
      function minimizeWin(w){w.min=true;w.d.classList.add('min');w.d.classList.remove('active');if(active===w){active=topWin();active&&active.d.classList.add('active')}renderTaskbar()}
      function setMax(w,on){w.max=on;w.d.classList.toggle('max',on);const b=$('[data-a=max]',w.d);b.innerHTML=on?I.resw:I.maxw;b.setAttribute('aria-label',on?'Verkleinern':'Maximieren')}
      function toggleMax(w){setMax(w,!w.max)}
      function closeWin(w){w.onclose&&w.onclose();w.d.classList.add('closing');setTimeout(()=>w.d.remove(),160);wins=wins.filter(x=>x!==w);if(active===w){active=topWin();active&&active.d.classList.add('active')}renderTaskbar()}
      function closeAllWins(){[...wins].forEach(w=>{w.onclose&&w.onclose();w.d.remove()});wins=[];active=null;renderTaskbar()}
      function bindDrag(w){
        const tb=$('.tb',w.d);let sx,sy,ox,oy,moving=false,lastTap=0;
        tb.addEventListener('dblclick',e=>{if(!e.target.closest('.tbb'))toggleMax(w)});
        tb.addEventListener('pointerdown',e=>{
          if(e.target.closest('.tbb')||e.button!==0)return;
          if(e.pointerType!=='mouse'){const t=Date.now();if(t-lastTap<320){toggleMax(w);lastTap=0;return}lastTap=t}
          sx=e.clientX;sy=e.clientY;ox=w.d.offsetLeft;oy=w.d.offsetTop;moving=false;tb.setPointerCapture(e.pointerId);
          const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
            if(!moving){if(Math.abs(dx)+Math.abs(dy)<4)return;moving=true;w.d.classList.add('drag');
              if(w.max){const r=w.d.getBoundingClientRect();const fw=parseFloat(w.d.style.width);setMax(w,false);ox=ev.clientX-area.getBoundingClientRect().left-Math.min(fw/2,ev.clientX-r.left);oy=0;sx=ev.clientX;sy=ev.clientY}}
            const ar=area.getBoundingClientRect();
            w.d.style.left=Math.min(Math.max(ox+(ev.clientX-sx),-w.d.offsetWidth+80),ar.width-80)+'px';
            w.d.style.top=Math.min(Math.max(oy+(ev.clientY-sy),0),ar.height-32)+'px'};
          const up=ev=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);tb.removeEventListener('pointercancel',up);w.d.classList.remove('drag');
            if(moving&&ev.clientY-area.getBoundingClientRect().top<=4){w.d.style.top='20px';setMax(w,true)}};
          tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);tb.addEventListener('pointercancel',up);
        });
      }
      function bindResize(w){
        $$('.rz',w.d).forEach(h=>h.addEventListener('pointerdown',e=>{
          e.preventDefault();e.stopPropagation();const dir=h.dataset.r;const sx=e.clientX,sy=e.clientY,sw=w.d.offsetWidth,sh=w.d.offsetHeight;h.setPointerCapture(e.pointerId);w.d.classList.add('drag');
          const mv=ev=>{if(dir!=='b')w.d.style.width=Math.max(260,sw+ev.clientX-sx)+'px';if(dir!=='r')w.d.style.height=Math.max(180,sh+ev.clientY-sy)+'px'};
          const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);w.d.classList.remove('drag')};
          h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
        }));
      }
      addEventListener('resize',()=>{if(small())wins.forEach(w=>setMax(w,true))});

        const zm=d=>{zoom=Math.max(50,Math.min(300,zoom+d));ta.style.fontSize=15*zoom/100+'px';$('.zm',b).textContent=zoom+' %'};

          menu(M,r.left,r.bottom+2)});

      /* ---------- App: Calculator ---------- */
      function openCalc(w,b){
        b.innerHTML=`<div class="calc"><div class="calc-h">${I.burger.replace('<svg','<svg style="width:16px;height:16px"')} Standard</div><div class="calc-line"></div><div class="calc-val">0</div><div class="calc-mem"><span>MC</span><span>MR</span><span>M+</span><span>M−</span><span>MS</span></div><div class="calc-k"></div></div>`;
        const keys=['%','CE','C','⌫','⅟x','x²','√x','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='];
        const K=$('.calc-k',b);keys.forEach(k=>{const bt=el('button',/^[0-9,±]$/.test(k)?'n':k==='='?'eq':'',k);bt.onclick=()=>press(k);K.append(bt)});
        let acc=null,op=null,cur='0',fresh=false,line='',err=false;
        const fmt=n=>{if(!isFinite(n))return 'Fehler';const r=Math.round(n*1e12)/1e12;return Math.abs(r)>=1e16?r.toExponential(6).replace('.',','):r.toLocaleString(DE,{maximumFractionDigits:12})};
        const show=()=>{let disp;if(err)disp=cur;else if(/[.]$/.test(cur)||/\.\d*0$/.test(cur)&&cur.includes('.')){const [i,f]=cur.split('.');disp=(+i).toLocaleString(DE)+','+f;if(cur.startsWith('-')&&+i===0)disp='-'+disp}else disp=fmt(+cur);
          const v=$('.calc-val',b);v.textContent=disp;v.style.fontSize=disp.length>14?'28px':disp.length>10?'36px':'46px';$('.calc-line',b).textContent=line};
        const calc=(a,c,o)=>o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c;
        function press(k){
          if(err&&k!=='C'&&k!=='CE'){err=false;cur='0';acc=null;op=null;line=''}
          if(/^[0-9]$/.test(k)){if(fresh){cur='0';fresh=false}if(cur.replace(/[-.]/g,'').length>=16)return;cur=cur==='0'?k:cur==='-0'?'-'+k:cur+k}
          else if(k===','){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
          else if(k==='C'){acc=null;op=null;cur='0';line='';err=false}
          else if(k==='CE'){cur='0';err=false}
          else if(k==='⌫'){if(fresh)return;cur=cur.length>1&&!(cur.length===2&&cur.startsWith('-'))?cur.slice(0,-1):'0'}
          else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?cur:'-'+cur)}
          else if(['÷','×','−','+'].includes(k)){if(op&&!fresh){acc=calc(acc,+cur,op);if(isNaN(acc))return fail()}else if(op===null)acc=+cur;op=k;line=fmt(acc)+' '+k;cur=String(acc);fresh=true}
          else if(k==='='){if(op===null){line=fmt(+cur)+' =';fresh=true}else{const c=+cur;line=fmt(acc)+' '+op+' '+fmt(c)+' =';const r=calc(acc,c,op);if(isNaN(r))return fail();cur=String(r);acc=null;op=null;fresh=true}}
          else if(k==='%'){cur=String(acc!=null?acc*(+cur)/100:+cur/100);fresh=true}
          else if(k==='⅟x'){if(+cur===0)return fail();line='1/('+fmt(+cur)+')';cur=String(1/(+cur));fresh=true}
          else if(k==='x²'){line='sqr('+fmt(+cur)+')';cur=String((+cur)**2);fresh=true}
          else if(k==='√x'){if(+cur<0){err=true;cur='Ungültige Eingabe';show();return}line='√('+fmt(+cur)+')';cur=String(Math.sqrt(+cur));fresh=true}
          show();
        }
        const fail=()=>{err=true;cur='Division durch Null nicht möglich';line='';acc=null;op=null;show();$('.calc-val',b).style.fontSize='22px'};
        w.onkey=e=>{const m={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','Delete':'CE',',':',','.':',','%':'%'};const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();press(k);const bt=[...K.children].find(x=>x.textContent===k);if(bt){bt.style.filter='brightness(.88)';setTimeout(()=>bt.style.filter='',120)}}};
        show();
      }

        const ro=new ResizeObserver(()=>{const r=wrap.getBoundingClientRect();const nw=Math.max(1,Math.floor(r.width)),nh=Math.max(1,Math.floor(r.height));if(nw===cv.width&&nh===cv.height)return;const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;t.getContext('2d').drawImage(cv,0,0);cv.width=nw;cv.height=nh;fill();ctx.drawImage(t,0,0)});ro.observe(wrap);

        const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};

      function openTerminal(w,b,o){
        let cwd=Array.isArray(o.cwd)?[...o.cwd]:[],hist=[],hi=0;
        b.innerHTML=`<div class="term-tabs"><div class="term-tab">${I.tab}<span>Ollidows PowerShell</span></div></div><div class="term scroll"></div>`;
        const T=$('.term',b);
        const out=(t,c='')=>{const d=el('div',c);d.textContent=t;T.insertBefore(d,lineEl);T.scrollTop=T.scrollHeight};
        const prompt=()=>`PS C:\\Users\\${S.user}${cwd.length?'\\'+cwd.join('\\'):''}> `;
        const lineEl=el('div','ln');T.append(lineEl);
        const draw=()=>{lineEl.innerHTML=`<span class="pp"></span><input aria-label="Befehl" autocomplete="off" spellcheck="false">`;$('.pp',lineEl).textContent=prompt();const inp=$('input',lineEl);inp.onkeydown=key;setTimeout(()=>inp.focus(),30)};

        const resolve=a=>{if(!a||a==='.')return cwd;let p=a.replace(/\//g,'\\').startsWith('\\')?[]:[...cwd];for(const s of a.replace(/\//g,'\\').split('\\')){if(!s||s==='.')continue;if(s==='..')p.pop();else{const n=nodeAt(p);const c=(n?.ch||[]).find(x=>x.n.toLowerCase()===s.toLowerCase());if(!c)return null;p.push(c.n)}}return p};
        function run(line){
          const [cmd,...args]=line.trim().split(/\s+/);const a=args.join(' ');if(!cmd)return;const c=cmd.toLowerCase();
          const H={
            help:()=>out('Verfügbare Befehle:\n  help        Diese Hilfe\n  dir, ls     Inhalt des Ordners anzeigen\n  cd <ordner> Ordner wechseln (cd .. = zurück)\n  mkdir <n>   Neuen Ordner anlegen\n  type <d>    Textdatei anzeigen\n  echo <t>    Text ausgeben (echo text > datei.txt speichert)\n  start <app> App öffnen (explorer, browser, calc, paint …)\n  date, time  Datum / Uhrzeit\n  whoami      Benutzername\n  ver         Ollidows-Version\n  neofetch    Systeminfo\n  color <f>   Textfarbe (grün, blau, gelb, weiß, rot)\n  cls, clear  Bildschirm leeren\n  exit        Terminal schließen'),
            dir:()=>{const n=nodeAt(cwd);out(`\n    Verzeichnis: C:\\Users\\${S.user}${cwd.length?'\\'+cwd.join('\\'):''}\n\nMode   LastWriteTime        Length  Name\n----   -------------        ------  ----`);(n.ch||[]).forEach(x=>out(`${x.t==='dir'?'d----':'-a---'}  ${fDT(x.d||now).padEnd(19)}  ${(x.t==='dir'?'':sizeOf(x)).padStart(7)}  ${x.n}`,x.t==='dir'?'acc':''));out('')},
            cd:()=>{if(!a){out(prompt().slice(3,-2));return}const p=resolve(a);if(!p||nodeAt(p)?.t!=='dir')out(`cd: Der Pfad „${a}“ wurde nicht gefunden.`,'err');else cwd=p},
            mkdir:()=>{if(!a)return out('mkdir: Name fehlt.','err');const n=nodeAt(cwd);n.ch.push(D(uniqueName(n,a)));fsChanged();out(`Ordner „${a}“ erstellt.`,'gr')},
            type:()=>{const n=nodeAt(cwd);const f=(n.ch||[]).find(x=>x.n.toLowerCase()===a.toLowerCase());if(!f)out(`type: „${a}“ nicht gefunden.`,'err');else if(f.t!=='txt')out('type: Keine Textdatei.','err');else out(f.c||'')},
            echo:()=>{const m=a.match(/^(.*?)\s*>\s*(.+)$/);if(m){const n=nodeAt(cwd);let f=n.ch.find(x=>x.n===m[2]);if(!f){f=F(m[2],'txt',{c:''});n.ch.push(f)}f.c=m[1];f.d=Date.now();fsChanged();out(`In ${m[2]} gespeichert.`,'gr')}else out(a)},
            start:()=>{const map={explorer:'explorer',browser:'browser',calc:'calc',rechner:'calc',paint:'paint',notepad:'notepad',editor:'notepad',settings:'settings',einstellungen:'settings',store:'store',fotos:'photos',photos:'photos',uhr:'clock',clock:'clock',minen:'mines',mines:'mines',ollistore:'store'};const id=map[a.toLowerCase()];if(id&&APPS[id]){openApp(id);out(`${APPS[id].name} wird gestartet …`,'gr')}else out(`start: App „${a}“ nicht gefunden.`,'err')},

        const R=9,C=9,M=10;let grid,over,started,flags,flagMode=false,t=0,tid=null,opened;

        const G=$('.mn-g',b),face=$('.mn-face',b);

        const nb=i=>{const r=Math.floor(i/C),c=i%C,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)o.push(rr*C+cc)}return o};
        function open(i){const c=grid[i];if(c.o||c.f||over)return;if(!started){started=true;place(i);tid=setInterval(()=>{t++;$('#mt',b).textContent=pad(t)},1000)}

      const firedEv=new Set();

        const d=new Date(),k=ymd(d),t=pad2(d.getHours())+':'+pad2(d.getMinutes());
        S.events.forEach(e=>{if(e.date===k&&e.time===t&&!firedEv.has(e.id)){firedEv.add(e.id);notify('calendar','Termin: '+e.title,e.note||('Jetzt um '+e.time+' Uhr'))}});
      }
      function evRow(e){return `<div class="ag-i"><span class="tm">${e.time||'ganztägig'}</span><span class="tt">${esc(e.title)}${e.note?`<small>${esc(e.note)}</small>`:''}</span><button data-del="${e.id}" aria-label="Termin löschen">${I.x}</button></div>`}
      function openCalendar(w,b,o){
        let sel=(o&&o.sel)||calSel,view=new Date(sel+'T00:00:00');view.setDate(1);
        b.innerHTML='<div class="capp"><div class="capp-l"></div><div class="capp-r scroll"></div></div>';
        const L=$('.capp-l',b),R=$('.capp-r',b);
        function draw(){
          const y=view.getFullYear(),m=view.getMonth(),st=(new Date(y,m,1).getDay()+6)%7,tk=ymd(new Date());
          let g=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="wd">${x}</span>`).join('');
          for(let i=0;i<42;i++){const d=new Date(y,m,i-st+1),k=ymd(d),ev=evOn(k);g+=`<button class="cd${d.getMonth()!==m?' o':''}${k===tk?' t':''}${k===sel?' s':''}" data-d="${k}"><b>${d.getDate()}</b>${ev.slice(0,2).map(e=>`<i>${esc((e.time?e.time+' ':'')+e.title)}</i>`).join('')}${ev.length>2?`<i>+${ev.length-2} weitere</i>`:''}</button>`}
          L.innerHTML=`<div class="capp-h"><h2>${view.toLocaleDateString(DE,{month:'long',year:'numeric'})}</h2><button data-n="t">Heute</button><button data-n="p" aria-label="Vorheriger Monat">${I.up}</button><button data-n="n" aria-label="Nächster Monat">${I.down}</button></div><div class="capp-g">${g}</div>`;
          const sd=new Date(sel+'T00:00:00'),list=evOn(sel);
          const up=S.events.filter(e=>e.date>=tk).sort((a,c)=>(a.date+(a.time||'')).localeCompare(c.date+(c.time||''))).slice(0,6);
          R.innerHTML=`<h3>${sd.toLocaleDateString(DE,{weekday:'long',day:'numeric',month:'long'})}</h3>${list.length?list.map(evRow).join(''):'<div class="ag-e">Keine Termine an diesem Tag</div>'}<form class="ag-add" id="ca-add"><input class="inp" id="ca-t" placeholder="Titel des Termins" maxlength="80" aria-label="Titel"><input class="inp" id="ca-time" type="time" aria-label="Uhrzeit"><input class="inp" id="ca-n" placeholder="Notiz (optional)" maxlength="200" aria-label="Notiz"><button class="btn pri" type="submit">Termin hinzufügen</button></form><h4>Als Nächstes</h4>${up.length?up.map(e=>`<button class="ag-i" data-go="${e.date}" style="text-align:left"><span class="tm">${new Date(e.date+'T00:00:00').toLocaleDateString(DE,{day:'2-digit',month:'2-digit'})}</span><span class="tt">${esc(e.title)}</span></button>`).join(''):'<div class="ag-e">Nichts geplant</div>'}`;
          $$('.cd',L).forEach(x=>x.onclick=()=>{sel=x.dataset.d;calSel=sel;const d=new Date(sel+'T00:00:00');if(d.getMonth()!==m){view=new Date(d.getFullYear(),d.getMonth(),1)}draw()});
          $$('[data-n]',L).forEach(x=>x.onclick=()=>{const a=x.dataset.n;if(a==='t'){sel=ymd(new Date());calSel=sel;view=new Date();view.setDate(1)}else view=new Date(y,m+(a==='p'?-1:1),1);draw()});
          $$('[data-del]',R).forEach(x=>x.onclick=()=>delEvent(x.dataset.del));
          $$('[data-go]',R).forEach(x=>x.onclick=()=>{sel=x.dataset.go;calSel=sel;view=new Date(sel+'T00:00:00');view.setDate(1);draw()});
          $('#ca-add',R).onsubmit=e=>{e.preventDefault();addEvent($('#ca-t',R).value,sel,$('#ca-time',R).value,$('#ca-n',R).value)};
        }
        w.refreshCal=draw;draw();
      }

      /* ---------- Ankündigungen der Entwickler ---------- */
      const LV={info:'Information',wichtig:'Wichtig',voll:'Vollbild-Meldung'};
      let annQueue=[],annShown=false;const annDone=new Set();
      function sendAnn(title,text,level,repeat){
        const a={id:'a'+Date.now().toString(36),title:title.trim().slice(0,60),text:text.trim().slice(0,500),level,repeat:!!repeat,t:Date.now(),seen:false};
        S.ann.unshift(a);S.ann=S.ann.slice(0,50);save();
        if(screen==='main')deliverAnn();
        return a;
      }
      function deliverAnn(){
        S.ann.filter(a=>!a.seen&&!annDone.has(a.id)||a.repeat&&!annDone.has(a.id)).reverse().forEach(a=>{
          annDone.add(a.id);if(!a.repeat)a.seen=true;
          if(a.level==='voll')annQueue.push(a);else notify('devnews',a.title,a.text);
        });
        save();nextAnn();
      }
      function nextAnn(){
        if(annShown||!annQueue.length||screen!=='main')return;
        const a=annQueue.shift();annShown=true;
        const m=$('#ann');m.hidden=false;
        m.innerHTML=`<div class="ann-card" role="dialog" aria-modal="true" aria-labelledby="ann-t"><div class="ann-top">${MO(26)}<span>Ankündigung der Entwickler</span></div><h2 id="ann-t">${esc(a.title)}</h2><p>${esc(a.text)}</p><small>${fDT(a.t)} · ${LV[a.level]||''}</small><button class="btn pri" id="ann-ok">Verstanden</button></div>`;
        $('#ann-ok').onclick=()=>{m.hidden=true;m.innerHTML='';annShown=false;nextAnn()};
        setTimeout(()=>$('#ann-ok')?.focus(),50);tone([660,880,1100],.5,.09);
      }
      function renderLockAnn(){
        const e=$('#lk-ann'),a=S.ann[0];if(!e)return;
        if(!a){e.hidden=true;return}
        e.hidden=false;e.innerHTML=`${I.megaphone}<div><small>Ankündigung der Entwickler</small><b>${esc(a.title)}</b><p>${esc(a.text)}</p></div>`;
      }

      /* ---------- Admin-Konsole (geheim) ---------- */
      const adminCode=()=>String(LS.get('adminCode','1337'));
      function openAdminGate(){closeAll();openApp('admin')}
      function openAdmin(w,b){
        let ok=false,tab='send',msg='',tries=0,lockUntil=0,confirmReset=false;
        const form={title:'',text:'',level:'info',repeat:false};
        const NAV=[['send','Ankündigung senden'],['hist','Verlauf'],['sys','System'],['apps','Benutzer-Apps']];
        function faceGate(){
          b.innerHTML=`<div class="adm-gate"><div>${MO(56)}</div><h2 style="margin:6px 0 0;font-weight:600">Gesichtserkennung</h2><p style="margin:0;color:var(--text2);max-width:320px">Haben Sie Ihre Facecam angeschlossen?</p><div style="display:flex;gap:8px"><button class="btn pri" id="fc-y">Ja</button><button class="btn" id="fc-n">Nein</button></div><div class="ob-err" id="fc-e"></div></div>`;
          $('#fc-n',b).onclick=()=>{$('#fc-e',b).textContent='Ohne Facecam kein Zugang.'};
          $('#fc-y',b).onclick=()=>{b.innerHTML='<div class="adm-gate"><div class="zface">😊</div><p>Gesicht wird gescannt …</p></div>';setTimeout(()=>{b.innerHTML=`<div class="adm-gate">${ZCHK}<p>Erkannt</p></div>`;setTimeout(()=>{ok=true;msg='';draw()},1000)},2000)}
        }
        function gate(){return faceGate();
          b.innerHTML=`<div class="adm-gate"><div>${MO(56)}</div><h2 style="margin:6px 0 0;font-weight:600">Administrator-Zugang</h2><p style="margin:0;color:var(--text2);max-width:320px">Nur für Entwickler. Gib den Admin-Code ein.</p><input class="inp" id="ad-pin" type="password" autocomplete="off" aria-label="Admin-Code" placeholder="••••"><div class="ob-err" id="ad-err">${esc(msg)}</div><button class="btn pri" id="ad-go">Entsperren</button></div>`;
          const go=()=>{
            if(Date.now()<lockUntil){msg='Zu viele Versuche. Warte kurz.';return gate()}
            if($('#ad-pin',b).value===adminCode()){ok=true;msg='';draw()}
            else{tries++;if(tries>=3){lockUntil=Date.now()+10000;tries=0;msg='Falscher Code. Gesperrt für 10 Sekunden.'}else msg='Falscher Code.';gate()}
          };
          $('#ad-go',b).onclick=go;$('#ad-pin',b).onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')go()};
          setTimeout(()=>$('#ad-pin',b)?.focus(),60);
        }
        function body(){
          if(tab==='send')return `<h1>Ankündigung senden</h1><p class="sub">Als Benachrichtigung, auf dem Sperrbildschirm oder als Vollbild-Fenster.</p><div class="adm-f"><label>Titel<input class="inp" id="ad-t" maxlength="60" value="${esc(form.title)}"></label><label>Nachricht<textarea class="inp" id="ad-x" maxlength="500">${esc(form.text)}</textarea></label><div><div class="cap">Art</div><div class="seg">${[['info','Information'],['wichtig','Wichtig'],['voll','Vollbild']].map(([k,n])=>`<button data-lv="${k}" class="${form.level===k?'on':''}">${n}</button>`).join('')}</div></div><label class="chk"><input type="checkbox" id="ad-rep" ${form.repeat?'checked':''}> Bei jedem Start erneut anzeigen</label><div class="row"><button class="btn pri" id="ad-send">Jetzt senden</button><span class="adm-ok" id="ad-ok">${esc(msg)}</span></div></div>`;
          if(tab==='hist')return `<h1>Verlauf</h1><p class="sub">Alle gesendeten Ankündigungen. Die neueste steht auf dem Sperrbildschirm.</p>${S.ann.length?S.ann.map(a=>`<div class="adm-item"><div class="bd"><span class="lv ${a.level}">${LV[a.level]}</span><b>${esc(a.title)}</b>${a.repeat?' · bei jedem Start':''}<small>${esc(a.text)}</small><small>${fDT(a.t)}</small></div><div class="acts"><button class="btn" data-re="${a.id}">Erneut senden</button><button class="btn" data-rm="${a.id}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch nichts gesendet.</div>'}`;
          if(tab==='sys')return `<h1>System</h1><p class="sub">Einstellungen nur für Administratoren.</p><div class="adm-f"><label>Startdauer in Minuten (0 = sofort)<input class="inp" id="ad-boot" type="number" min="0" max="30" step="1" value="${Math.round((+LS.get('bootSecs',10)||0)/60)}"></label><div class="row"><button class="btn pri" id="ad-bsave">Startdauer speichern</button><span class="adm-ok" id="ad-ok">${esc(msg)}</span></div><label>Neuer Admin-Code (mindestens 4 Zeichen)<input class="inp" id="ad-new" type="password" autocomplete="off"></label><div class="row"><button class="btn" id="ad-csave">Code ändern</button></div></div><hr class="adm-hr"><div class="adm-f"><div class="cap">Alle gespeicherten Daten (Dateien, Apps, Termine, Ankündigungen) löschen und neu starten.</div><div class="row">${confirmReset?'<button class="btn dng" id="ad-rs-yes">Ja, alles löschen</button><button class="btn" id="ad-rs-no">Abbrechen</button>':'<button class="btn dng" id="ad-rs">Zurücksetzen</button>'}</div></div>`;
          return `<h1>Benutzer-Apps</h1><p class="sub">Apps, die im Olli Store per HTML hochgeladen wurden.</p>${S.dev.length?S.dev.map(g=>`<div class="adm-item"><div class="bd"><b>${esc(g.name)}</b><small>${esc(g.cat)} · ${fDT(g.t)} · ${Math.max(1,Math.round(g.html.length/1024))} KB</small></div><div class="acts"><button class="btn" data-app-rm="${g.id}">Löschen</button></div></div>`).join(''):'<div class="empty">Es wurden noch keine Apps hochgeladen.</div>'}`;
        }
        function draw(){
          if(!ok)return gate();
          b.innerHTML=`<div class="adm"><nav class="adm-side"><div class="brand">${MO(26)}<span>Admin</span></div>${NAV.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</nav><div class="adm-main scroll">${body()}</div></div>`;
          const M=$('.adm-main',b);
          $$('[data-tab]',b).forEach(x=>x.onclick=()=>{tab=x.dataset.tab;msg='';confirmReset=false;draw()});
          $$('[data-lv]',M).forEach(x=>x.onclick=()=>{form.title=$('#ad-t',M).value;form.text=$('#ad-x',M).value;form.repeat=$('#ad-rep',M).checked;form.level=x.dataset.lv;draw()});
          const snd=$('#ad-send',M);if(snd)snd.onclick=()=>{
            form.title=$('#ad-t',M).value;form.text=$('#ad-x',M).value;form.repeat=$('#ad-rep',M).checked;
            if(!form.title.trim()||!form.text.trim()){msg='Titel und Nachricht fehlen noch.';return draw()}
            sendAnn(form.title,form.text,form.level,form.repeat);form.title='';form.text='';msg='Gesendet.';draw();
          };
          $$('[data-re]',M).forEach(x=>x.onclick=()=>{const a=S.ann.find(k=>k.id===x.dataset.re);if(a){annDone.delete(a.id);a.seen=false;a.t=Date.now();save();deliverAnn();msg='';draw()}});
          $$('[data-rm]',M).forEach(x=>x.onclick=()=>{S.ann=S.ann.filter(k=>k.id!==x.dataset.rm);save();draw()});
          const bs=$('#ad-bsave',M);if(bs)bs.onclick=()=>{const v=Math.max(0,Math.min(30,Math.round(+$('#ad-boot',M).value||0)));LS.set('bootSecs',v*60);msg=v?`Gespeichert: Start dauert ${v} Min.`:'Gespeichert: Start ohne Wartezeit.';draw()};
          const cs=$('#ad-csave',M);if(cs)cs.onclick=()=>{const v=$('#ad-new',M).value;if(v.length<4){msg='Der Code braucht mindestens 4 Zeichen.';return draw()}LS.set('adminCode',v);msg='Admin-Code geändert.';draw()};
          const rs=$('#ad-rs',M);if(rs)rs.onclick=()=>{confirmReset=true;draw()};
          const rn=$('#ad-rs-no',M);if(rn)rn.onclick=()=>{confirmReset=false;draw()};
          const ry=$('#ad-rs-yes',M);if(ry)ry.onclick=()=>zReset();
          $$('[data-app-rm]',M).forEach(x=>x.onclick=()=>{const id=x.dataset.appRm;S.dev=S.dev.filter(g=>g.id!==id);S.installed=S.installed.filter(i=>i!==id);S.pins=S.pins.filter(i=>i!==id);wins.filter(k=>k.app===id).forEach(closeWin);delete APPS[id];save();renderTaskbar();draw()});
        }
        draw();
      }

      /* ---------- Keyboard ---------- */
      let metaAlone=false;
      document.addEventListener('keydown',e=>{
        if(screen==='boot'){if(e.key==='Escape'){const t=Date.now();escN=t-escT<1500?escN+1:1;escT=t;if(escN>=3)skipBoot()}return}
        if(screen==='main'&&e.ctrlKey&&e.altKey&&String(e.key).toLowerCase()==='a'){e.preventDefault();openAdminGate();return}
        if(screen==='lock'){if(!$('#lock').classList.contains('auth'))authLock();else if(e.key==='Enter'&&$('#signin'))signIn();else if(e.key==='Escape'){$('#lock').classList.remove('auth');$('#login').innerHTML=''}return}
        if(screen!=='main')return;
        if(e.key==='Meta'||e.key==='OS'){metaAlone=true;return}metaAlone=false;
        if(e.key==='Escape'){closeAll();return}
        const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
        if(active&&!active.min&&active.onkey)active.onkey(e);
      });
      document.addEventListener('keyup',e=>{if((e.key==='Meta'||e.key==='OS')&&metaAlone&&screen==='main'){toggleFly('start')}metaAlone=false});

      /* ---------- Tick ---------- */
      function tick(){const d=new Date();$('#lk-t').textContent=fT(d);$('#lk-d').textContent=d.toLocaleDateString(DE,{weekday:'long',day:'numeric',month:'long'});if(screen==='main'){renderClock();checkEvents()}}
      setInterval(tick,1000);

      /* ---------- Bootmenü, Linux Kit, Arsch Linux ---------- */
      const ZX=$('#zx'),zsleep=ms=>new Promise(r=>setTimeout(r,ms));let zSel=0,zTap=[];
      function zShow(h,c){show('none');ZX.hidden=false;ZX.className='screen '+(c||'');ZX.innerHTML=h;ZX.scrollTop=0}
      function zHide(){ZX.hidden=true;ZX.innerHTML=''}
      const _boot=boot;
      boot=function(){zHide();_boot();$('#boot').insertAdjacentHTML('beforeend','<div class="zhint">Entf / F2 / F12 drücken oder 5× auf den Bildschirm tippen: Bootmenü</div>')};
      $('#boot').addEventListener('pointerdown',()=>{const t=Date.now();zTap=zTap.filter(x=>t-x<3000);zTap.push(t);if(zTap.length>=5){zTap=[];if(screen==='boot')zBios()}});
      document.addEventListener('keydown',e=>{
        if(screen==='boot'&&['Delete','F2','F12'].includes(e.key)){e.preventDefault();zBios();return}
        if(screen!=='bios')return;const n=zEntries().length;
        if(e.key==='Enter'){e.preventDefault();zPick(zEntries()[zSel].id)}
        else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();zSel=(zSel+(e.key==='ArrowDown'?1:n-1))%n;zDrawBios()}
      },true);
      const zEntries=()=>{const a=[{id:'win',t:'Ollidows 11',s:'Windows-Start-Manager'}];if(LS.get('linuxKit',false))a.push({id:'lnx',t:'Arsch Linux',s:'GRUB 2.12 – Linux 6.9.0-arsch'});return a};
      function zBios(sel=0){screen='bios';clearInterval(bootTimer);zSel=sel;zDrawBios()}
      function zDrawBios(){const en=zEntries();
        zShow(`<div class="zb"><div class="zbh">Ollidows UEFI – Boot-Menü</div><p>Startgerät wählen: ↑ ↓ und Enter, oder antippen.</p>${en.map((x,i)=>`<button class="zbi${i===zSel?' on':''}" data-i="${i}"><b>${x.t}</b><small>${x.s}</small></button>`).join('')}<div class="zbf">${en.length<2?'Kein weiteres Betriebssystem gefunden.':''}</div></div>`,'zbios');
        $$('.zbi',ZX).forEach(b=>b.onclick=()=>zPick(en[+b.dataset.i].id))}
      function zPick(id){if(id==='lnx')zLinux();else boot()}
      /* Linux Kit Download-Seite im Ollidows-Browser */
      const LKPAGE=()=>{const d=LS.get('linuxKit',false);return `<div class="bp"><h2>Linux Kit</h2><div class="meta">linuxkit.olli · Offizielle Download-Seite</div><p style="color:var(--text2)">Das Linux Kit fügt deinem PC im Bootmenü ein zweites Betriebssystem hinzu: <b>Arsch Linux</b>.</p><button class="btn pri" data-lkdl>${d?'Erneut herunterladen':'Linux Kit herunterladen (612 MB)'}</button><p class="lks" style="color:var(--text2);margin-top:12px"></p></div>`};

        const iv=setInterval(()=>{p+=1+Math.floor(Math.random()*9);if(p<100){b.textContent='Wird heruntergeladen … '+p+' %';return}clearInterval(iv);
          const dir=nodeAt(['Downloads']);if(dir){dir.ch.push({n:uniqueName(dir,'Linux-Kit.zip'),t:'zip',s:'612 MB',d:Date.now()});fsChanged()}

          notify('browser','Download abgeschlossen','Linux-Kit.zip wurde in „Downloads“ gespeichert.')},220)});
      /* Arsch Linux */

        g.textContent='';for(const l of K){g.textContent+=l+'\n';ZX.scrollTop=1e9;await zsleep(150+Math.random()*120)}
        for(let p=0;p<=100;p+=5){g.textContent=`Arsch-Installer 1.0\n\nWindows-Partition „Ollidows 11“ (NTFS, 238 GB) wird gelöscht …\n\n[${'#'.repeat(p/5)}${'.'.repeat(20-p/5)}] ${p} %`;await zsleep(150)}
        g.textContent+='\n\nFertig. Ollidows 11 wurde entfernt.\nDesktop wird gestartet …';await zsleep(900);zShow('<div class="zsp"><div class="zpeng">🐧</div><b>Arsch Linux</b><div class="zbar"><i></i></div></div>','');await zsleep(3200);zLogin()}
      function zDesk(){screen='lnx';
        zShow(`<div class="zd"><div class="ztop"><span>Aktivitäten</span><b id="zclk"></b><button id="zpow" aria-label="Neustart">↩ Zurück zu Windows</button></div><div class="zdock"><button id="zdf" aria-label="Arschfox">🦊</button><button id="zdt" aria-label="Terminal">⌨</button><button id="zdd" aria-label="Dateien">📁</button><button id="zds" aria-label="Einstellungen">⚙</button></div><div id="zwins"></div></div>`,'');

        if(!PCU)return `<div class="pc-lock"><b>Jugendschutz ist aktiv</b><p style="margin:0;color:var(--text2)">Gib die Eltern-PIN ein, um Einstellungen zu ändern.</p><input class="inp" id="pc-u" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" aria-label="Eltern-PIN"><div class="ob-err" id="pc-ue"></div><button class="btn pri" data-pcact="unlock">Entsperren</button></div>`;

      }
      function pcEnforce(){PC_OK.clear();wins.filter(w=>pcBlocked(w.app)).forEach(closeWin);}
      function pcBind(main,draw){
        $$('[data-pc]',main).forEach(x=>x.onchange=()=>{const c=pcCfg();c[x.dataset.pc]=x.checked;pcSave(c);pcEnforce()});
        $$('[data-pcapp]',main).forEach(x=>x.onchange=()=>{const c=pcCfg();c.apps[x.dataset.pcapp]=x.checked;pcSave(c);pcEnforce()});
        $$('[data-pcsel]',main).forEach(x=>x.onchange=()=>{const c=pcCfg();c.limit=+x.value;pcSave(c)});
        $$('input',main).forEach(i=>i.addEventListener('keydown',e=>{e.stopPropagation()}));
        $$('[data-pcact]',main).forEach(x=>x.onclick=()=>{const a=x.dataset.pcact,c=pcCfg();
          if(a==='setpin'){const p1=$('#pc-n1',main).value,p2=$('#pc-n2',main).value,e=$('#pc-ne',main);if(!/^\d{4,6}$/.test(p1))return e.textContent='Die PIN braucht 4 bis 6 Ziffern.';if(p1!==p2)return e.textContent='Die PINs stimmen nicht überein.';c.pin=p1;pcSave(c);PCU=true;notify('settings','Jugendschutz aktiviert','Die Eltern-PIN wurde festgelegt.');draw()}
          else if(a==='unlock'){if($('#pc-u',main).value===c.pin){PCU=true;draw()}else{$('#pc-ue',main).textContent='Die PIN ist falsch.'}}
          else if(a==='lock'){PCU=false;draw()}
          else if(a==='off'){c.pin=null;c.apps={};c.store=c.buy=c.chat=false;c.limit=0;pcSave(c);PCU=false;draw()}});
        const u=$('#pc-u',main);if(u)u.addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-pcact=unlock]',main).click()});
      }

      /* ---------- Office: gemeinsame Helfer ---------- */
      const DOCS_DIR=['Dokumente'];
      TYPES.doc='Word-Dokument';TYPES.ppt='PowerPoint-Präsentation';
      function officeSave(st,type,ext,title,content){
        const want=(title.trim()||'Unbenannt').replace(/[\\/:*?"<>|]/g,'_').slice(0,60)+ext;
        let n=st.name&&st.path?nodeAt([...st.path,st.name]):null;
        if(n){if(n.n!==want){const dir=nodeAt(st.path);n.n=uniqueName(dir,want);st.name=n.n}n.c=content;n.d=Date.now()}
        else{const dir=nodeAt(DOCS_DIR)||S.files;st.path=nodeAt(DOCS_DIR)?DOCS_DIR:[];const nm=uniqueName(dir,want);dir.ch.push(F(nm,type,{c:content,d:Date.now()}));st.name=nm}
        const nn=nodeAt([...st.path,st.name]);if(nn)addRecent(st.path,nn);fsChanged();return st.name;
      }
      const stripExt=n=>String(n||'').replace(/\.(docx|pptx)$/i,'');
      const officeTop=(icon,label,ph,id)=>{const m=mcSess();return `${icon.replace('<svg','<svg width="20" height="20"')}<b>${label}</b><input id="${id}" placeholder="${ph}" maxlength="60" aria-label="${ph}"><span style="flex:1"></span><span style="font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px">${MO(16)}${esc(m?m.name:'')}</span><button class="btn" id="${id}s">Speichern</button>`};
      function pickImage(cb,max=900){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=String(r.result)};r.readAsDataURL(file)};f.click()}

      function openWord(w,b,o){

        const FONTS=['Calibri','Arial','Times New Roman','Georgia','Verdana','Courier New','Comic Sans MS'],SIZES=[10,11,12,14,16,18,20,24,28,32,40,48,72];

n><span id="wd-cc">0 Zeichen</span><span id="wd-sv"></span><input type="range" id="wd-z" min="50" max="200" value="100" aria-label="Zoom"><span id="wd-zv">100 %</span></div></div>`;
        const pg=$('#wd-p',b),nm=$('#wd-n',b),bar=$('#wd-bar',b);
        if(st.path&&st.name){const n=nodeAt([...st.path,st.name]);if(n){pg.innerHTML=n.c||'<p><br></p>';nm.value=stripExt(st.name)}}else{pg.innerHTML='<h1>Neues Dokument</h1><p>Beginne hier zu schreiben …</p>';nm.value='Dokument'}
        try{document.execCommand('styleWithCSS',false,true);document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
        const upd=()=>{const t=pg.innerText.replace(/​/g,'').trim();$('#wd-wc',b).textContent=(t?t.split(/\s+/).length:0).toLocaleString(DE)+' Wörter';$('#wd-cc',b).textContent=t.length.toLocaleString(DE)+' Zeichen';w.setTitle(`${dirty?'* ':''}${nm.value||'Unbenannt'} – Word`)};
        const markDirty=()=>{dirty=true;$('#wd-sv',b).textContent='Nicht gespeichert';upd()};
        pg.addEventListener('input',markDirty);nm.addEventListener('input',markDirty);
        let rng=null;document.addEventListener('selectionchange',()=>{if(!b.isConnected)return;const s=getSelection();if(s.rangeCount&&pg.contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange()});
        const restore=()=>{pg.focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}};
        bar.addEventListener('mousedown',e=>{if(!e.target.closest('select,input'))e.preventDefault()});
        const exec=(c,v)=>{restore();document.execCommand(c,false,v||null);markDirty()};
        $$('[data-c]',bar).forEach(x=>x.onclick=()=>exec(x.dataset.c));
        $$('[data-k]',bar).forEach(x=>x.oninput=()=>exec(x.dataset.k,x.value));
        $$('[data-s]',bar).forEach(x=>x.onchange=()=>{const k=x.dataset.s;
          if(k==='block')exec('formatBlock',x.value==='p'?'<p>':'<'+x.value+'>');
          else if(k==='font')exec('fontName',x.value);
          else{exec('fontSize','7');pg.querySelectorAll('font[size="7"],span[style*="xxx-large"]').forEach(f=>{const s=document.createElement('span');s.style.fontSize=x.value+'px';s.innerHTML=f.innerHTML;f.replaceWith(s)})}
          markDirty()});
        $$('[data-x]',bar).forEach(x=>x.onclick=()=>{const k=x.dataset.x;
          if(k==='hr')exec('insertHorizontalRule');
          else if(k==='img'){restore();pickImage(src=>{restore();document.execCommand('insertImage',false,src);markDirty()})}
          else if(k==='table'){const m=zModal('<h3 style="margin:0 0 8px">Tabelle einfügen</h3><div class="dev-2"><label>Spalten<input class="inp" id="t-c" type="number" min="1" max="10" value="3"></label><label>Zeilen<input class="inp" id="t-r" type="number" min="1" max="30" value="3"></label></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="t-ok">Einfügen</button><button class="btn" id="t-x">Abbrechen</button></div>');
            $('#t-x',m).onclick=()=>m.remove();$('#t-ok',m).onclick=()=>{const c=Math.max(1,Math.min(10,+$('#t-c',m).value||3)),r=Math.max(1,Math.min(30,+$('#t-r',m).value||3));m.remove();exec('insertHTML',`<table>${'<tr>'+'<td><br></td>'.repeat(c)+'</tr>'.repeat(1)}`.replace(/$/,'').concat(('<tr>'+'<td><br></td>'.repeat(c)+'</tr>').repeat(r-1))+'</table><p><br></p>')}}});
        pg.addEventListener('keydown',e=>{e.stopPropagation();const k=e.key.toLowerCase();
          if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();save()}
          else if(e.key==='Tab'){e.preventDefault();document.execCommand('insertHTML',false,'&emsp;&emsp;')}});
        nm.addEventListener('keydown',e=>e.stopPropagation());
        pg.addEventListener('paste',e=>{const t=e.clipboardData&&e.clipboardData.getData('text/plain');if(t&&!(e.clipboardData.files&&e.clipboardData.files.length)){e.preventDefault();document.execCommand('insertText',false,t)}});
        $('#wd-z',b).oninput=e=>{const z=+e.target.value;pg.style.zoom=z/100;$('#wd-zv',b).textContent=z+' %'};
        function save(){const clone=pg.cloneNode(true);const n=officeSave(st,'doc','.docx',nm.value,clone.innerHTML);dirty=false;$('#wd-sv',b).textContent='Gespeichert '+fT(new Date());nm.value=stripExt(n);upd();notify('word','Gespeichert',`${n} in ${st.path.join(' › ')}`)}
        $('#wd-ns',b).onclick=save;
        w.onclose=()=>{if(dirty&&pg.innerText.trim()){try{officeSave(st,'doc','.docx',nm.value,pg.innerHTML);notify('word','Automatisch gespeichert',`${st.name} in ${st.path.join(' › ')}`)}catch(e){}}};
        w.refresh=()=>{};upd();setTimeout(()=>pg.focus(),200);
      }

      /* ---------- PowerPoint ---------- */
      const PPT_THEMES=[
        {n:'Büro',bg:'#ffffff',t:'#1c2b4a',x:'#3a4256',a:'#e8572f'},
        {n:'Nacht',bg:'#12151f',t:'#ffffff',x:'#c4cbdb',a:'#4c8dff'},
        {n:'Ozean',bg:'linear-gradient(135deg,#0b3a6b,#1a8fd1)',t:'#ffffff',x:'#e4f3ff',a:'#ffd84d'},
        {n:'Sonnenuntergang',bg:'linear-gradient(135deg,#ff7e5f,#feb47b)',t:'#3a1020',x:'#4a2030',a:'#3a1020'},
        {n:'Wald',bg:'#eaf4e4',t:'#164a2a',x:'#2c4a38',a:'#2e9c4a'},
        {n:'Mono',bg:'#f2f2f2',t:'#111111',x:'#444444',a:'#111111'}];
      const pid=()=>Math.random().toString(36).slice(2,8);
      function pptLayout(kind,th){
        const T=PPT_THEMES[th]||PPT_THEMES[0];
        if(kind==='title')return {bg:T.bg,notes:'',els:[{id:pid(),k:'text',x:8,y:28,w:84,h:24,t:'Titel der Präsentation',size:6.4,b:1,c:T.t,al:'center'},{id:pid(),k:'text',x:14,y:56,w:72,h:12,t:'Untertitel oder Name',size:2.8,c:T.x,al:'center'},{id:pid(),k:'shape',s:'rect',x:42,y:52,w:16,h:.9,f:T.a}]};
        if(kind==='content')return {bg:T.bg,notes:'',els:[{id:pid(),k:'text',x:6,y:6,w:88,h:15,t:'Folientitel',size:4.6,b:1,c:T.t,al:'left'},{id:pid(),k:'shape',s:'rect',x:6,y:21,w:10,h:.9,f:T.a},{id:pid(),k:'text',x:6,y:26,w:88,h:66,t:'• Erster Punkt\n• Zweiter Punkt\n• Dritter Punkt',size:2.9,c:T.x,al:'left'}]};
        return {bg:T.bg,notes:'',els:[]};
      }
      function pptEl(e){
        const st=`left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${e.h}%;`;
        if(e.k==='text')return `<div class="pp-el" data-id="${e.id}" style="${st}font-size:${e.size}cqw;color:${e.c};font-weight:${e.b?700:400};font-style:${e.i?'italic':'normal'};text-align:${e.al||'left'};white-space:pre-wrap;padding:.5cqw 1cqw;${e.fill?`background:${e.fill};`:''}">${esc(e.t)}</div>`;
        if(e.k==='shape')return `<div class="pp-el" data-id="${e.id}" style="${st}background:${e.f};border-radius:${e.s==='ellipse'?'50%':'.4cqw'}"></div>`;
        return `<div class="pp-el" data-id="${e.id}" style="${st}"><img src="${e.src}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;pointer-events:none"></div>`;
      }
      const pptDraw=(host,sl)=>{host.style.background=sl.bg;host.innerHTML=sl.els.map(pptEl).join('')};
      function openPpt(w,b,o){
        const st={path:o.path||null,name:o.name||null};let dirty=false,cur=0,sel=null,theme=0,undo=[];
        let slides=[pptLayout('title',0),pptLayout('content',0)];
        b.innerHTML=`<div class="pp" style="position:relative"><div class="pp-top">${officeTop(I.ppt,'PowerPoint','Präsentationsname','pp-n')}</div><div class="pp-bar" id="pp-bar"><button data-a="slide">Folie ▾</button><button data-a="theme">Design ▾</button><span class="sep"></span><button data-a="text">Text</button><button data-a="rect">Rechteck</button><button data-a="ellipse">Ellipse</button><button data-a="img">Bild</button><span class="sep"></span><button data-a="smaller" title="Schrift kleiner">A−</button><button data-a="bigger" title="Schrift größer">A+</button><button data-a="bold"><b>F</b></button><button data-a="italic"><i>K</i></button><button data-a="al-left">⯇</button><button data-a="al-center">≡</button><button data-a="al-right">⯈</button><input type="color" data-k="c" value="#222222" title="Textfarbe" aria-label="Textfarbe"><input type="color" data-k="f" value="#e8572f" title="Füllfarbe" aria-label="Füllfarbe"><input type="color" data-k="bg" value="#ffffff" title="Folienhintergrund" aria-label="Folienhintergrund"><span class="sep"></span><button data-a="del">Löschen</button><button data-a="undo">↶</button><button data-a="play" style="font-weight:600">▶ Präsentieren</button></div><div class="pp-main"><div class="pp-side" id="pp-side"></div><div class="pp-stage"><div class="pp-slide" id="pp-st" tabindex="0"></div><div class="pp-notes"><input class="inp" id="pp-no" placeholder="Notizen zur Folie" aria-label="Notizen"></div></div></div></div>`;
        const root=$('.pp',b),stage=$('#pp-st',b),side=$('#pp-side',b),nm=$('#pp-n',b),bar=$('#pp-bar',b),notes=$('#pp-no',b);
        if(st.path&&st.name){const n=nodeAt([...st.path,st.name]);if(n&&n.c){try{const d=JSON.parse(n.c);if(d.slides&&d.slides.length){slides=d.slides;theme=d.theme||0}}catch(e){}}nm.value=stripExt(st.name)}else nm.value='Präsentation';
        const S0=()=>slides[cur],E0=()=>S0().els.find(e=>e.id===sel);
        const title=()=>w.setTitle(`${dirty?'* ':''}${nm.value||'Unbenannt'} – PowerPoint`);
        const mark=()=>{dirty=true;title()};
        const snap=()=>{undo.push(JSON.stringify(slides));if(undo.length>40)undo.shift()};
        function drawSide(){side.innerHTML=slides.map((s,i)=>`<div class="pp-th${i===cur?' on':''}" data-i="${i}"><span>${i+1}</span><div class="mini"></div></div>`).join('');
          $$('.pp-th',side).forEach((t,i)=>{pptDraw($('.mini',t),slides[i]);t.onclick=()=>{cur=i;sel=null;drawAll()}})}
        function drawStage(){pptDraw(stage,S0());notes.value=S0().notes||'';
          $$('.pp-el',stage).forEach(n=>{const e=S0().els.find(x=>x.id===n.dataset.id);if(!e)return;
            if(e.id===sel){n.classList.add('sel');const h=document.createElement('i');h.className='hd';n.append(h);h.addEventListener('pointerdown',ev=>{ev.stopPropagation();ev.preventDefault();drag(ev,e,n,'size')})}
            n.addEventListener('pointerdown',ev=>{if(n.isContentEditable||ev.target.classList.contains('hd'))return;ev.preventDefault();stage.focus();if(sel!==e.id){sel=e.id;drawStage()}drag(ev,e,stage.querySelector(`[data-id="${e.id}"]`),'move')});
            if(e.k==='text')n.addEventListener('dblclick',()=>editText(e,stage.querySelector(`[data-id="${e.id}"]`)))})}
        const drawAll=()=>{drawSide();drawStage();title()};
        function drag(ev,e,node,mode){
          const r=stage.getBoundingClientRect(),x0=ev.clientX,y0=ev.clientY,ox=e.x,oy=e.y,ow=e.w,oh=e.h;let moved=false;
          const mv=m=>{const dx=(m.clientX-x0)/r.width*100,dy=(m.clientY-y0)/r.height*100;if(!moved&&Math.hypot(m.clientX-x0,m.clientY-y0)<3)return;if(!moved){snap();moved=true}
            if(mode==='move'){e.x=Math.max(-5,Math.min(100-e.w+5,ox+dx));e.y=Math.max(-5,Math.min(100-e.h+5,oy+dy))}else{e.w=Math.max(2,Math.min(100-e.x,ow+dx));e.h=Math.max(.8,Math.min(100-e.y,oh+dy))}
            node.style.left=e.x+'%';node.style.top=e.y+'%';node.style.width=e.w+'%';node.style.height=e.h+'%'};
          const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(moved){mark();drawSide()}};
          addEventListener('pointermove',mv);addEventListener('pointerup',up)}
        function editText(e,n){if(!n)return;n.contentEditable='true';n.focus();const s=getSelection(),r=document.createRange();r.selectNodeContents(n);s.removeAllRanges();s.addRange(r);
          const done=()=>{n.removeEventListener('blur',done);if(!n.isConnected)return;const t=n.innerText.replace(/\n$/,'');if(t!==e.t){snap();e.t=t;mark()}n.contentEditable='false';drawAll()};n.addEventListener('blur',done);n.addEventListener('keydown',k=>{k.stopPropagation();if(k.key==='Escape')n.blur()})}
        const add=el=>{snap();S0().els.push(el);sel=el.id;mark();drawAll()};
        const T=()=>PPT_THEMES[theme];
        function pick(kind){snap();slides.splice(cur+1,0,pptLayout(kind,theme));cur++;sel=null;mark();drawAll()}
